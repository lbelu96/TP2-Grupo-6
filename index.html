        empatiaMoleculaX[i],
        empatiaMoleculaY[i],
        empatiaMoleculaDestinoX[i],
        empatiaMoleculaDestinoY[i]
      );


    if (
      distancia < 5
    ) {

      empatiaMoleculaActiva[i] =
        false;


      var origen =
        empatiaMoleculaOrigen[i];


      var destino =
        empatiaMoleculaDestino[i];


      var lado =
        sk.min(sk.width, sk.height);


      empatiaCuadrados[
        origen
      ].tamano =
        sk.max(
          empatiaCuadrados[
            origen
          ].tamano - 0.65,

          lado * 0.05
        );


      empatiaCuadrados[
        destino
      ].tamano =
        sk.min(
          empatiaCuadrados[
            destino
          ].tamano + 0.65,

          lado * 0.32
        );
    }
  }
}


// ========================================
// DIBUJAR MOLÉCULAS
// ========================================

function dibujarMoleculasEmpatia() {

  sk.rectMode(sk.CENTER);

  sk.noStroke();


  for (
    var i = 0;
    i < empatiaCantidadMoleculas;
    i++
  ) {

    if (
      empatiaMoleculaActiva[i]
    ) {

      // AURA ROJA

      sk.fill(
        255,
        0,
        0,
        30
      );


      sk.rect(
        empatiaMoleculaX[i],
        empatiaMoleculaY[i],
        24,
        24
      );


      // NÚCLEO ROJO

      sk.fill(
        255,
        0,
        0
      );


      sk.rect(
        empatiaMoleculaX[i],
        empatiaMoleculaY[i],
        8,
        8
      );


      // PUNTO BLANCO

      sk.fill(
        255,
        180,
        180
      );


      sk.rect(
        empatiaMoleculaX[i],
        empatiaMoleculaY[i],
        3,
        3
      );
    }
  }


  sk.rectMode(sk.CORNER);
}


// ========================================
// COMPROBAR EQUILIBRIO
// ========================================

function comprobarEquilibrioEmpatia() {

  var mayor =
    -Infinity;

  var menor =
    Infinity;


  for (
    var i = 0;
    i < empatiaCuadrados.length;
    i++
  ) {

    mayor =
      sk.max(
        mayor,
        empatiaCuadrados[i].tamano
      );


    menor =
      sk.min(
        menor,
        empatiaCuadrados[i].tamano
      );
  }


  var diferencia =
    mayor - menor;


  if (
    diferencia <= 15
  ) {

    empatiaEquilibrio = true;

    empatiaTiempoEquilibrio = 0;

    empatiaPulso = 0;

    empatiaTransfiriendo = false;

    empatiaOrigen = -1;

    empatiaTouchActivo = false;

    empatiaTouchID = -1;
  }
}


// ========================================
// PULSO FINAL
// ========================================

function ejecutarPulsoEmpatia() {

  empatiaTiempoEquilibrio++;

  empatiaPulso += 0.18;


  var escala =
    1 +
    sk.sin(empatiaPulso) *
    0.05;


  for (
    var i = 0;
    i < empatiaCuadrados.length;
    i++
  ) {

    dibujarCuadradoEmpatiaPulso(
      empatiaCuadrados[i],
      escala
    );
  }


  if (
    empatiaTiempoEquilibrio >=
    empatiaDuracionEquilibrio
  ) {

    crearEscenarioEmpatia();
  }
}


// ========================================
// CUADRADO DEL PULSO
// ========================================

function dibujarCuadradoEmpatiaPulso(
  cuadrado,
  escala
) {

  var tamano =
    cuadrado.tamano *
    escala;


  sk.noStroke();

  sk.rectMode(sk.CENTER);


  sk.fill(
    150,
    50,
    220,
    20
  );


  sk.rect(
    cuadrado.x,
    cuadrado.y,
    tamano + 45,
    tamano + 45
  );


  sk.fill(
    150,
    50,
    220,
    45
  );


  sk.rect(
    cuadrado.x,
    cuadrado.y,
    tamano + 25,
    tamano + 25
  );


  sk.fill(
    150,
    50,
    220
  );


  sk.rect(
    cuadrado.x,
    cuadrado.y,
    tamano,
    tamano
  );


  sk.rectMode(sk.CORNER);
}


// ========================================
// BUSCAR TOUCH ACTIVO
// ========================================

function actualizarEstadoTouchEmpatia() {

  if (
    empatiaEquilibrio
  ) {

    return;
  }


  // No hay dedos tocando

  if (
    sk.touches.length === 0
  ) {

    empatiaTouchActivo = false;

    empatiaTouchID = -1;

    empatiaTransfiriendo = false;

    empatiaOrigen = -1;

    return;
  }


  // ====================================
  // SI YA TENEMOS UN DEDO ASIGNADO
  // ====================================

  if (
    empatiaTouchID !== -1
  ) {

    for (
      var i = 0;
      i < sk.touches.length;
      i++
    ) {

      if (
        sk.touches[i].id ===
        empatiaTouchID
      ) {

        empatiaTouchActivo = true;

        empatiaTransfiriendo = true;

        return;
      }
    }


    // El dedo desapareció

    empatiaTouchActivo = false;

    empatiaTouchID = -1;

    empatiaTransfiriendo = false;

    empatiaOrigen = -1;
  }


  // ====================================
  // BUSCAR UN NUEVO DEDO
  // ====================================

  for (
    var i = 0;
    i < sk.touches.length;
    i++
  ) {

    var tx =
      sk.touches[i].x;

    var ty =
      sk.touches[i].y;


    for (
      var j = 0;
      j < empatiaCuadrados.length;
      j++
    ) {

      var cuadrado =
        empatiaCuadrados[j];


      if (

        tx >
        cuadrado.x -
        cuadrado.tamano / 2 &&

        tx <
        cuadrado.x +
        cuadrado.tamano / 2 &&

        ty >
        cuadrado.y -
        cuadrado.tamano / 2 &&

        ty <
        cuadrado.y +
        cuadrado.tamano / 2

      ) {

        empatiaOrigen = j;

        empatiaTouchID =
          sk.touches[i].id;

        empatiaTouchActivo = true;

        empatiaTransfiriendo = true;

        return;
      }
    }
  }
}

function sketch_colaboracion(sk) {
var colaboracionDisparos = [];
var colaboracionCuadrados = [];

var colaboracionTocando = [false, false, false, false];

var colaboracionExplotando = false;
var colaboracionPantallaBlanca = false;

var colaboracionCarga = 0;

var colaboracionTiempoExplosion;
var colaboracionDuracionExplosion = 650;

var colaboracionTiempoBlanco;
var colaboracionDuracionBlanco = 500;

var colaboracionParticulas = [];
var colaboracionCantidadParticulas = 90;


// =====================================================
// SETUP
// =====================================================

sk.setup = function() {

  var _cnv = sk.createCanvas(_anchoVentana(sk), _altoVentana(sk));

  // Evita que el navegador haga zoom, scroll o gestos
  // mientras tocamos el canvas (usamos el canvas de ESTA instancia,
  // no el primero que encuentre en todo el documento).
  _cnv.elt.style.touchAction = "none";
  _cnv.elt.style.userSelect = "none";
  _cnv.elt.style.webkitUserSelect = "none";

  crearParticulasColaboracion();
  iniciarColaboracion();
}


// =====================================================
// DRAW
// =====================================================

sk.draw = function() {

  sk.background(0);

  dibujarParticulasColaboracion();


  // Actualizamos los cuatro botones según
  // TODOS los dedos que están actualmente sobre la pantalla.
  actualizarToquesColaboracion();


  if (colaboracionPantallaBlanca) {

    animarPantallaBlancaColaboracion();

    return;
  }


  if (colaboracionExplotando) {

    animarExplosionColaboracion();

    return;
  }


  actualizarColaboracion();

  actualizarDisparosColaboracion();

  mostrarJefeColaboracion();


  for (
    var i = 0;
    i < 4;
    i++
  ) {

    colaboracionCuadrados[i].mostrar(
      colaboracionTocando[i]
    );
  }


  for (
    var i = 0;
    i < colaboracionDisparos.length;
    i++
  ) {

    colaboracionDisparos[i].mostrar();
  }
}


// =====================================================
// PARTICULAS DEL FONDO
// =====================================================

function crearParticulasColaboracion() {

  colaboracionParticulas = [];

  for (
    var i = 0;
    i < colaboracionCantidadParticulas;
    i++
  ) {

    colaboracionParticulas.push({

      x: sk.random(sk.width),
      y: sk.random(sk.height),

      vx: sk.random(-0.15, 0.15),
      vy: sk.random(-0.15, 0.15),

      tamano: sk.random(1, 3),

      opacidad: sk.random(15, 55)
    });
  }
}


function dibujarParticulasColaboracion() {

  sk.noStroke();

  for (
    var i = 0;
    i < colaboracionParticulas.length;
    i++
  ) {

    var p =
      colaboracionParticulas[i];


    p.x += p.vx;
    p.y += p.vy;


    if (p.x < 0) {
      p.x = sk.width;
    }

    if (p.x > sk.width) {
      p.x = 0;
    }


    if (p.y < 0) {
      p.y = sk.height;
    }

    if (p.y > sk.height) {
      p.y = 0;
    }


    sk.fill(
      150,
      150,
      160,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// =====================================================
// INICIAR COLABORACION
// =====================================================

function iniciarColaboracion() {

  colaboracionDisparos = [];

  colaboracionCuadrados = [];


  var margenHorizontal =
    sk.min(sk.width * 0.08, 100);

  var margenVertical =
    sk.min(sk.height * 0.12, 100);


  colaboracionCuadrados.push(
    new CuadradoColaboracion(
      margenHorizontal,
      margenVertical
    )
  );


  colaboracionCuadrados.push(
    new CuadradoColaboracion(
      sk.width - margenHorizontal,
      margenVertical
    )
  );


  colaboracionCuadrados.push(
    new CuadradoColaboracion(
      margenHorizontal,
      sk.height - margenVertical
    )
  );


  colaboracionCuadrados.push(
    new CuadradoColaboracion(
      sk.width - margenHorizontal,
      sk.height - margenVertical
    )
  );


  colaboracionCarga = 0;

  colaboracionExplotando = false;

  colaboracionPantallaBlanca = false;


  for (
    var i = 0;
    i < 4;
    i++
  ) {

    colaboracionTocando[i] = false;
  }
}


// =====================================================
// MULTITOUCH
// =====================================================

function actualizarToquesColaboracion() {

  // Primero apagamos todos los botones.

  for (
    var i = 0;
    i < 4;
    i++
  ) {

    colaboracionTocando[i] = false;
  }


  // Si no hay dedos, no hacemos nada más.

  if (
    sk.touches.length === 0
  ) {

    return;
  }


  // Recorremos TODOS los dedos.

  for (
    var i = 0;
    i < sk.touches.length;
    i++
  ) {

    var toque =
      sk.touches[i];


    var tx =
      toque.x;

    var ty =
      toque.y;


    // Comprobamos ese dedo contra
    // los cuatro cuadrados.

    for (
      var j = 0;
      j < 4;
      j++
    ) {

      var cuadrado =
        colaboracionCuadrados[j];


      var mitad =
        cuadrado.tamano / 2;


      if (
        tx >= cuadrado.x - mitad &&
        tx <= cuadrado.x + mitad &&
        ty >= cuadrado.y - mitad &&
        ty <= cuadrado.y + mitad
      ) {

        colaboracionTocando[j] = true;
      }
    }
  }
}


// =====================================================
// LOGICA DEL JUEGO
// =====================================================

function actualizarColaboracion() {

  var cantidadActivos = 0;


  for (
    var i = 0;
    i < 4;
    i++
  ) {

    if (
      colaboracionTocando[i]
    ) {

      cantidadActivos++;
    }
  }


  if (
    cantidadActivos === 0
  ) {

    return;
  }


  var limiteCarga =
    cantidadActivos * 25;


  if (
    colaboracionCarga >= limiteCarga
  ) {

    return;
  }


  // Cada cuadrado presionado
  // puede lanzar disparos.

  for (
    var i = 0;
    i < 4;
    i++
  ) {

    if (
      colaboracionTocando[i] &&
      sk.random(1) < 0.65
    ) {

      colaboracionDisparos.push(
        new DisparoColaboracion(
          colaboracionCuadrados[i].x,
          colaboracionCuadrados[i].y
        )
      );
    }
  }
}


// =====================================================
// DISPAROS
// =====================================================

function actualizarDisparosColaboracion() {

  var cantidadActivos = 0;


  for (
    var i = 0;
    i < 4;
    i++
  ) {

    if (
      colaboracionTocando[i]
    ) {

      cantidadActivos++;
    }
  }


  var limiteCarga =
    cantidadActivos * 25;


  for (
    var i =
      colaboracionDisparos.length - 1;

    i >= 0;

    i--
  ) {

    var disparo =
      colaboracionDisparos[i];


    disparo.actualizar();


    if (
      disparo.impacto
    ) {

      if (
        colaboracionCarga <
        limiteCarga
      ) {

        colaboracionCarga += 1;
      }


      if (
        colaboracionCarga >
        limiteCarga
      ) {

        colaboracionCarga =
          limiteCarga;
      }


      colaboracionDisparos.splice(
        i,
        1
      );

      continue;
    }


    if (
      disparo.fueraPantalla()
    ) {

      colaboracionDisparos.splice(
        i,
        1
      );
    }
  }


  // Solo ganamos cuando los cuatro
  // botones están siendo tocados
  // simultáneamente.

  if (
    cantidadActivos === 4 &&
    colaboracionCarga >= 100
  ) {

    colaboracionCarga = 100;

    comenzarExplosionColaboracion();
  }
}


// =====================================================
// JEFE CENTRAL
// =====================================================

function mostrarJefeColaboracion() {

  var tamano = 230;

  var x = sk.width / 2;

  var y = sk.height / 2;


  sk.rectMode(sk.CENTER);

  sk.noStroke();


  // Halo gris muy sutil

  sk.fill(
    180,
    180,
    185,
    12
  );


  sk.rect(
    x,
    y,
    tamano + 35,
    tamano + 35
  );


  // Cuerpo gris

  sk.fill(
    120,
    120,
    125
  );


  sk.rect(
    x,
    y,
    tamano,
    tamano
  );


  // =================================================
  // CARGA ROJA
  // =================================================

  var alturaCarga =
    sk.map(
      colaboracionCarga,
      0,
      100,
      0,
      tamano
    );


  if (
    alturaCarga > 0
  ) {

    sk.fill(
      255,
      0,
      0
    );


    // La carga crece desde abajo hacia arriba.

    sk.rect(
      x,
      y +
      tamano / 2 -
      alturaCarga / 2,
      tamano,
      alturaCarga
    );
  }


  sk.rectMode(sk.CORNER);
}


// =====================================================
// CUADRADOS DE COLABORACION
// =====================================================

function mostrarCuadradoColaboracion(
  cuadrado,
  presionado
) {

  sk.rectMode(sk.CENTER);

  sk.noStroke();


  var pulso = 1;


  // Si no está presionado,
  // respira/pulsa suavemente.

  if (
    !presionado
  ) {

    pulso =
      1 +
      sk.sin(
        sk.millis() * 0.003
      ) * 0.04;
  }


  var tamanoPulso =
    cuadrado.tamano * pulso;


  // Aura exterior

  sk.fill(
    150,
    50,
    220,
    14
  );


  sk.rect(
    cuadrado.x,
    cuadrado.y,
    tamanoPulso + 45,
    tamanoPulso + 45
  );


  // Aura interior

  sk.fill(
    150,
    50,
    220,
    25
  );


  sk.rect(
    cuadrado.x,
    cuadrado.y,
    tamanoPulso + 25,
    tamanoPulso + 25
  );


  // Cuando está presionado,
  // la luz se intensifica.

  if (
    presionado
  ) {

    sk.fill(
      190,
      120,
      255,
      90
    );


    sk.rect(
      cuadrado.x,
      cuadrado.y,
      cuadrado.tamano + 15,
      cuadrado.tamano + 15
    );
  }


  // Cuerpo violeta

  sk.fill(
    150,
    50,
    220
  );


  sk.rect(
    cuadrado.x,
    cuadrado.y,

    presionado
      ? cuadrado.tamano
      : tamanoPulso,

    presionado
      ? cuadrado.tamano
      : tamanoPulso
  );


  // Centro blanco/violeta cuando se presiona

  if (
    presionado
  ) {

    sk.fill(
      230,
      210,
      255
    );


    sk.rect(
      cuadrado.x,
      cuadrado.y,
      cuadrado.tamano - 20,
      cuadrado.tamano - 20
    );
  }


  sk.rectMode(sk.CORNER);
}


// =====================================================
// EXPLOSION
// =====================================================

function comenzarExplosionColaboracion() {

  colaboracionExplotando = true;

  colaboracionTiempoExplosion =
    sk.millis();


  colaboracionDisparos = [];


  for (
    var i = 0;
    i < 4;
    i++
  ) {

    colaboracionTocando[i] = false;
  }
}


function animarExplosionColaboracion() {

  var progreso =
    (
      sk.millis() -
      colaboracionTiempoExplosion
    ) /
    colaboracionDuracionExplosion;


  progreso =
    sk.constrain(
      progreso,
      0,
      1
    );


  sk.background(255);


  var escala =
    sk.lerp(
      1,
      2.5,
      progreso
    );


  var opacidadExplosion =
    sk.lerp(
      255,
      0,
      progreso
    );


  sk.push();


  sk.translate(
    sk.width / 2,
    sk.height / 2
  );


  sk.scale(
    escala
  );


  sk.noStroke();


  sk.fill(
    255,
    0,
    0,
    opacidadExplosion
  );


  sk.rectMode(sk.CENTER);


  sk.rect(
    0,
    0,
    230,
    230
  );


  sk.pop();


  sk.rectMode(sk.CORNER);


  if (
    progreso >= 1
  ) {

    comenzarPantallaBlancaColaboracion();
  }
}


// =====================================================
// PANTALLA BLANCA
// =====================================================

function comenzarPantallaBlancaColaboracion() {

  colaboracionExplotando = false;

  colaboracionPantallaBlanca = true;

  colaboracionTiempoBlanco =
    sk.millis();

  colaboracionCarga = 0;

  colaboracionDisparos = [];


  for (
    var i = 0;
    i < 4;
    i++
  ) {

    colaboracionTocando[i] = false;
  }
}


function animarPantallaBlancaColaboracion() {

  sk.background(255);


  if (
    sk.millis() -
    colaboracionTiempoBlanco >=
    colaboracionDuracionBlanco
  ) {

    iniciarColaboracion();
  }
}


// =====================================================
// CLASE CUADRADO
// =====================================================

class CuadradoColaboracion {

  constructor(
    x,
    y
  ) {

    this.x = x;

    this.y = y;

    this.tamano = 90;
  }


  mostrar(
    presionado
  ) {

    mostrarCuadradoColaboracion(
      this,
      presionado
    );
  }
}


// =====================================================
// CLASE DISPARO
// =====================================================

class DisparoColaboracion {

  constructor(
    x,
    y
  ) {

    this.x = x;

    this.y = y;


    this.velocidad =
      sk.random(
        9,
        13
      );


    this.impacto = false;
  }


  actualizar() {

    var objetivoX =
      sk.width / 2;


    var objetivoY =
      sk.height / 2;


    var dx =
      objetivoX -
      this.x;


    var dy =
      objetivoY -
      this.y;


    var distancia =
      sk.sqrt(
        dx * dx +
        dy * dy
      );


    if (
      distancia < 115
    ) {

      this.impacto = true;

      return;
    }


    if (
      distancia < 0.001
    ) {

      this.impacto = true;

      return;
    }


    dx /= distancia;

    dy /= distancia;


    this.x +=
      dx *
      this.velocidad;


    this.y +=
      dy *
      this.velocidad;
  }


  mostrar() {

    sk.noStroke();

    sk.rectMode(sk.CENTER);


    // Halo rojo

    sk.fill(
      255,
      0,
      0,
      35
    );


    sk.rect(
      this.x,
      this.y,
      26,
      26
    );


    // Láser rojo

    sk.fill(
      255,
      0,
      0
    );


    sk.rect(
      this.x,
      this.y,
      10,
      10
    );


    // Núcleo brillante

    sk.fill(
      255,
      180,
      180
    );


    sk.rect(
      this.x,
      this.y,
      4,
      4
    );


    sk.rectMode(sk.CORNER);
  }


  fueraPantalla() {

    return (
      this.x < -30 ||
      this.x > sk.width + 30 ||
      this.y < -30 ||
      this.y > sk.height + 30
    );
  }
}

var reiniciando = false;
var muerte = false;

var tiempoMuerte;

var duracionNegro = 3000;

var pulsoObjetivo = 1.2;

var intensidadObjetivo = 70;

var tiempoSalida = 0;

var offsetXIncertidumbre = 0;

function calcularEscalaIncertidumbre() {

      p.y < 0
    ) {

      p.y =
        700;
    }


    if (
      p.y > 700
    ) {

      p.y =
        0;
    }


    sk.fill(
      150,
      150,
      160,
      p.a
    );


    sk.ellipse(
      offsetXIncertidumbre +
      p.x *
      escalaIncertidumbre,

      offsetYIncertidumbre +
      p.y *
      escalaIncertidumbre,

      p.s *
      escalaIncertidumbre,

      p.s *
      escalaIncertidumbre
    );
  }
}


// =====================================================
// NIVEL
// =====================================================

function iniciarNivel() {

  triangulos = [];


  jugadorX = 100;

  jugadorY = 350;


  objetivoX =
    jugadorX;

  objetivoY =
    jugadorY;


  var intentos = 0;


  do {

    salidaX =
      sk.random(
        455,
        660
      );

    salidaY =
      sk.random(
        40,
        660
      );


    intentos++;

  } while (
    sk.dist(
      salidaX,
      salidaY,
      jugadorX,
      jugadorY
    ) < 450 &&
    intentos < 200
  );


  for (
    var i = 0;
    i < 45;
    i++
  ) {

    triangulos.push(
      new Triangulo(
        sk.random(
          30,
          670
        ),

        sk.random(
          30,
          670
        ),

        sk.random(
          20,
          70
        ),

        false
      )
    );
  }


  var ex;
  var ey;

  intentos = 0;


  do {

    ex =
      sk.random(
        350,
        670
      );

    ey =
      sk.random(
        30,
        670
      );


    intentos++;

  } while (
    sk.dist(
      ex,
      ey,
      jugadorX,
      jugadorY
    ) < 300 &&
    intentos < 200
  );


  enemigo =
    new Triangulo(
      ex,
      ey,
      65,
      true
    );


  triangulos.push(
    enemigo
  );


  pulsoActual = 1.2;

  pulsoObjetivo = 1.2;

  intensidadAura = 70;

  intensidadObjetivo = 70;

  tiempoPulso = 0;

  tiempoSalida = 0;

  tocando = false;

  reiniciando = false;

  muerte = false;
}


// =====================================================
// JUGADOR
// =====================================================

function moverJugador() {

  if (
    !tocando
  ) {

    return;
  }


  var dx =
    objetivoX -
    jugadorX;


  var dy =
    objetivoY -
    jugadorY;


  var d =
    sk.sqrt(
      dx * dx +
      dy * dy
    );


  if (
    d > 3
  ) {

    dx /= d;

    dy /= d;


    jugadorX +=
      dx *
      velocidad;

    jugadorY +=
      dy *
      velocidad;
  }


  // IMPORTANTE:
  // El límite corresponde al espacio virtual 700x700.

  jugadorX =
    sk.constrain(
      jugadorX,
      20,
      680
    );


  jugadorY =
    sk.constrain(
      jugadorY,
      20,
      680
    );
}


// =====================================================
// TRIANGULOS
// =====================================================

function actualizarTriangulos() {

  for (
    var t of triangulos
  ) {

    t.actualizar();
  }
}


// =====================================================
// ENFOQUE
// =====================================================

function detectarEnfoque() {

  var d =
    sk.dist(
      jugadorX,
      jugadorY,
      enemigo.x,
      enemigo.y
    );


  if (
    d < 150
  ) {

    pulsoObjetivo = 9;

    intensidadObjetivo = 175;

  } else {

    pulsoObjetivo = 1.2;

    intensidadObjetivo = 70;
  }
}


// =====================================================
// AURA
// =====================================================

function actualizarAura() {

  pulsoActual =
    sk.lerp(
      pulsoActual,
      pulsoObjetivo,
      0.035
    );


  intensidadAura =
    sk.lerp(
      intensidadAura,
      intensidadObjetivo,
      0.025
    );


  tiempoPulso +=
    0.035 *
    pulsoActual;
}


// =====================================================
// ESCENARIO
// =====================================================

function dibujarEscenario() {

  var radioVision =
    150;


  for (
    var t of triangulos
  ) {

    var d =
      sk.dist(
        jugadorX,
        jugadorY,
        t.x,
        t.y
      );


    if (
      d < radioVision
    ) {

      var a =
        sk.map(
          d,
          0,
          radioVision,
          230,
          0
        );


      t.mostrar(a);
    }
  }


  var ds =
    sk.dist(
      jugadorX,
      jugadorY,
      salidaX,
      salidaY
    );


  if (
    ds < 80
  ) {

    var a =
      sk.constrain(
        sk.map(
          ds,
          80,
          0,
          40,
          255
        ),
        40,
        255
      );


    var s = 24;


    sk.noStroke();


    sk.fill(
      255,
      a * 0.08
    );


    sk.triangle(
      salidaX,
      salidaY -
      s -
      15,

      salidaX -
      s -
      15,
      salidaY +
      s +
      15,

      salidaX +
      s +
      15,
      salidaY +
      s +
      15
    );


    sk.fill(
      190,
      190,
      200,
      a
    );


    sk.triangle(
      salidaX,
      salidaY -
      s,

      salidaX -
      s,
      salidaY +
      s,

      salidaX +
      s,
      salidaY +
      s
    );
  }
}


// =====================================================
// AURA JUGADOR
// =====================================================

function dibujarAura() {

  var p =
    sk.sin(
      tiempoPulso
    );


  var s =
    sk.map(
      p,
      -1,
      1,
      45,
      65
    );


  var a =
    sk.map(
      p,
      -1,
      1,
      intensidadAura *
      0.55,
      intensidadAura
    );


  sk.noStroke();


  sk.fill(
    150,
    50,
    220,
    a * 0.2
  );


  sk.ellipse(
    jugadorX,
    jugadorY,
    s + 35,
    s + 35
  );


  sk.fill(
    150,
    50,
    220,
    a
  );


  sk.ellipse(
    jugadorX,
    jugadorY,
    s,
    s
  );
}


// =====================================================
// JUGADOR
// =====================================================

function dibujarJugador() {

  sk.noStroke();


  sk.fill(
    150,
    50,
    220,
    25
  );


  sk.ellipse(
    jugadorX,
    jugadorY,
    77,
    77
  );


  sk.fill(
    150,
    50,
    220,
    45
  );


  sk.ellipse(
    jugadorX,
    jugadorY,
    57,
    57
  );


  sk.push();


  sk.translate(
    jugadorX,
    jugadorY
  );


  sk.rotate(
    sk.atan2(
      objetivoY -
      jugadorY,

      objetivoX -
      jugadorX
    )
  );


  sk.fill(
    150,
    50,
    220
  );


  sk.triangle(
    18,
    0,

    -14,
    -11,

    -14,
    11
  );


  sk.fill(
    220,
    180,
    255,
    180
  );


  sk.triangle(
    10,
    0,

    -8,
    -6,

    -8,
    6
  );


  sk.pop();
}


// =====================================================
// SALIDA
// =====================================================

function comprobarSalida() {

  if (
    sk.dist(
      jugadorX,
      jugadorY,
      salidaX,
      salidaY
    ) < 30
  ) {

    comenzarReinicio();
  }
}


// =====================================================
// ENEMIGO
// =====================================================

function comprobarEnemigo() {

  if (
    sk.dist(
      jugadorX,
      jugadorY,
      enemigo.x,
      enemigo.y
    ) < 18
  ) {

    comenzarMuerte();
  }
}


// =====================================================
// MUERTE
// =====================================================

function comenzarMuerte() {

  muerte = true;

  tocando = false;

  tiempoMuerte =
    sk.millis();
}


function animarMuerte() {

  var t =
    sk.millis() -
    tiempoMuerte;


  if (
    t < 180
  ) {

    sk.background(
      150,
      0,
      255
    );

    return;
  }


  if (
    t < 300
  ) {

    sk.background(255);

    return;
  }


  if (
    t < 420
  ) {

    sk.background(
      150,
      0,
      255
    );

    return;
  }


  if (
    t < 540
  ) {

    sk.background(255);

    return;
  }


  if (
    t <
    duracionMuerte +
    duracionNegro
  ) {

    sk.background(0);

    return;
  }


  muerte = false;

  iniciarNivel();
}


// =====================================================
// REINICIO / VICTORIA
// =====================================================

function comenzarReinicio() {

  reiniciando = true;

  tocando = false;

  tiempoReinicio =
    sk.millis();
}


function animarReinicio() {

  var progreso =
    sk.constrain(
      (
        sk.millis() -
        tiempoReinicio
      ) /
      3500,
      0,
      1
    );


  sk.background(0);

  dibujarParticulas();


  var centroX =
    sk.width / 2;


  var centroY =
    sk.height / 2;


  var opacidad =
    sk.map(
      progreso,
      0,
      1,
      255,
      0
    );


  var tamanoAura =
    sk.min(
      sk.width,
      sk.height
    ) *
    0.16;


  var tamano =
    sk.min(
      sk.width,
      sk.height
    ) *
    0.115;


  sk.noStroke();


  sk.fill(
    150,
    50,
    220,
    opacidad *
    0.15
  );


  sk.triangle(
    centroX,
    centroY -
    tamanoAura / 2,

    centroX -
    tamanoAura / 2,
    centroY +
    tamanoAura / 2,

    centroX +
    tamanoAura / 2,
    centroY +
    tamanoAura / 2
  );


  sk.fill(
    150,
    50,
    220,
    opacidad
  );


  sk.triangle(
    centroX,
    centroY -
    tamano / 2,

    centroX -
    tamano / 2,
    centroY +
    tamano / 2,

    centroX +
    tamano / 2,
    centroY +
    tamano / 2
  );


  if (
    progreso >= 1
  ) {

    reiniciando = false;

    iniciarNivel();
  }
}


// =====================================================
// TOUCH
// =====================================================

sk.touchStarted = function() {

  activarFullscreenIncertidumbre();


  if (
    sk.touches.length > 0
  ) {

    actualizarObjetivoTouch(
      sk.touches[0].x,
      sk.touches[0].y
    );


    tocando = true;
  }


  return false;
}


sk.touchMoved = function() {

  if (
    reiniciando ||
    muerte
  ) {

    return false;
  }


  if (
    sk.touches.length > 0
  ) {

    actualizarObjetivoTouch(
      sk.touches[0].x,
      sk.touches[0].y
    );


    tocando = true;
  }


  return false;
}


sk.touchEnded = function() {

  tocando = false;

  return false;
}


// =====================================================
// COORDENADAS TOUCH
// =====================================================

function actualizarObjetivoTouch(
  pantallaX,
  pantallaY
) {

  objetivoX =
    (
      pantallaX -
      offsetXIncertidumbre
    ) /
    escalaIncertidumbre;


  objetivoY =
    (
      pantallaY -
      offsetYIncertidumbre
    ) /
    escalaIncertidumbre;


  objetivoX =
    sk.constrain(
      objetivoX,
      20,
      680
    );


  objetivoY =
    sk.constrain(
      objetivoY,
      20,
      680
    );
}


// =====================================================
// FULLSCREEN
// =====================================================

function activarFullscreenIncertidumbre() {

  if (
    !fullscreenIncertidumbre
  ) {

    void 0;

    fullscreenIncertidumbre =
      true;
  }
}


// =====================================================
// RESIZE
// =====================================================

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );


  calcularEscalaIncertidumbre();

}


// =====================================================
// TRIANGULO
// =====================================================

class Triangulo {

  constructor(
    x,
    y,
    tamano,
    entidad
  ) {

    this.x = x;

    this.y = y;

    this.tamano = tamano;

    this.entidad = entidad;

    this.rotacion =
      sk.random(sk.TWO_PI);

    this.velocidadRotacion =
      sk.random(
        -0.01,
        0.01
      );

    this.tiempoRuido =
      sk.random(1000);
  }


  actualizar() {

    this.rotacion +=
      this.velocidadRotacion;


    if (
      !this.entidad
    ) {

      return;
    }


    this.tiempoRuido +=
      0.08;


    var dx =
      jugadorX -
      this.x;


    var dy =
      jugadorY -
      this.y;


    var d =
      sk.sqrt(
        dx * dx +
        dy * dy
      );


    if (
      d > 0.1
    ) {

      dx /= d;

      dy /= d;


      var ox =
        sk.sin(
          this.tiempoRuido *
          2.7
        ) *
        0.65;


      var oy =
        sk.cos(
          this.tiempoRuido *
          3.4
        ) *
        0.65;


      var mx =
        dx +
        ox;


      var my =
        dy +
        oy;


      var m =
        sk.sqrt(
          mx * mx +
          my * my
        );


      mx /= m;

      my /= m;


      this.x +=
        mx *
        velocidadEnemigo;


      this.y +=
        my *
        velocidadEnemigo;


      this.x +=
        sk.sin(
          this.tiempoRuido *
          5.7
        ) *
        0.45;


      this.y +=
        sk.cos(
          this.tiempoRuido *
          6.3
        ) *
        0.45;
    }


    this.rotacion +=
      sk.sin(
        this.tiempoRuido *
        4
      ) *
      0.025;
  }


  mostrar(a) {

    sk.push();


    sk.translate(
      this.x,
      this.y
    );


    sk.rotate(
      this.rotacion
    );


    sk.noStroke();


    if (
      this.entidad
    ) {

      sk.fill(
        255,
        0,
        0,
        a * 0.10
      );


      sk.triangle(
        0,
        -this.tamano / 2 - 35,

        -this.tamano / 2 - 35,
        this.tamano / 2 + 35,

        this.tamano / 2 + 35,
        this.tamano / 2 + 35
      );


      sk.fill(
        255,
        0,
        0,
        a * 0.18
      );


      sk.triangle(
        0,
        -this.tamano / 2 - 22,

        -this.tamano / 2 - 22,
        this.tamano / 2 + 22,

        this.tamano / 2 + 22,
        this.tamano / 2 + 22
      );


      sk.fill(
        255,
        0,
        0,
        a * 0.30
      );


      sk.triangle(
        0,
        -this.tamano / 2 - 10,

        -this.tamano / 2 - 10,
        this.tamano / 2 + 10,

        this.tamano / 2 + 10,
        this.tamano / 2 + 10
      );


      sk.fill(
        255,
        0,
        0,
        a
      );


      sk.triangle(
        0,
        -this.tamano / 2,

        -this.tamano / 2,
        this.tamano / 2,

        this.tamano / 2,
        this.tamano / 2
      );


      sk.fill(
        255,
        120,
        120,
        a * 0.65
      );


      sk.triangle(
        0,
        -this.tamano * 0.18,

        -this.tamano * 0.18,
        this.tamano * 0.18,

        this.tamano * 0.18,
        this.tamano * 0.18
      );

    } else {

      sk.fill(
        80,
        80,
        90,
        a
      );


      sk.triangle(
        0,
        -this.tamano / 2,

        -this.tamano / 2,
        this.tamano / 2,

        this.tamano / 2,
        this.tamano / 2
      );
    }


    sk.pop();
  }
}
}
function sketch_ansiedad(sk) {
var lienzo;

// =====================================================
// ANSIEDAD
// =====================================================

var ansiedadValor = 0.5;

var ansiedadVelocidadMovimiento = 3;
var ansiedadVelocidadRotacion = 0.035;
var ansiedadIntensidadTitileo = 0.8;
var ansiedadIntensidadTemblor = 2;

var ansiedadRotacion = 0;

var ansiedadXMovimiento = 0;
var ansiedadYMovimiento = 0;

var ansiedadTamanoActual = 180;

var ansiedadCalmando = false;
var ansiedadRespirando = false;
var ansiedadRegresando = false;

var ansiedadTiempoRespiracion = 0;
var ansiedadDuracionRespiracion = 3500;

var ansiedadOpacidad = 255;

var ansiedadUltimoClick = 0;
var ansiedadIntervaloClick = 300;

var ansiedadAlteracion = 0;

var ansiedadParticulas = [];
var ansiedadCantidadParticulas = 100;


// =====================================================
// TÁCTIL
// =====================================================

var ansiedadContactosAnteriores = [];
var ansiedadFullscreen = false;

// =====================================================

sk.setup = function() {

  lienzo = sk.createCanvas(

  );

  crearParticulasAnsiedad();
}


// =====================================================
// DRAW
// =====================================================

sk.draw = function() {

  sk.background(0);

  dibujarParticulasAnsiedad();

  actualizarTouchAnsiedad();


  if (
    !ansiedadRespirando &&
    !ansiedadRegresando
  ) {

    actualizarAnsiedad();

  }

  else if (
    ansiedadRespirando
  ) {

    actualizarRespiracionAnsiedad();

  }

  else if (

  ) {

  }


  dibujarTrianguloAnsiedad();
}


// =====================================================
// PARTÍCULAS
// =====================================================

function crearParticulasAnsiedad() {

  ansiedadParticulas = [];

  for (
    var i = 0;
    i < ansiedadCantidadParticulas;
    i++
  ) {

    ansiedadParticulas.push({

      x: sk.random(sk.width),
      y: sk.random(sk.height),

      vx: sk.random(
        -0.12,
        0.12
      ),

      vy: sk.random(
        -0.12,
        0.12
      ),

      tamano: sk.random(
        1,
        3
      ),

      opacidad: sk.random(
        15,
        55
      )
    });
  }
}


function dibujarParticulasAnsiedad() {

  sk.noStroke();

  for (
    var i = 0;
    i < ansiedadParticulas.length;
    i++
  ) {

    var p =
      ansiedadParticulas[i];

    p.x += p.vx;
    p.y += p.vy;


    if (p.x < 0) {
      p.x = sk.width;
    }

    if (p.x > sk.width) {
      p.x = 0;
    }

    if (p.y < 0) {
      p.y = sk.height;
    }

    if (p.y > sk.height) {
      p.y = 0;
    }


    sk.fill(
      150,
      150,
      160,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// =====================================================
// ANSIEDAD

function actualizarAnsiedad() {

  }

  else {

  }

    );

    );

    );

  ) {

      );

    ) {

        );

  var movimientoX =

    );

    );


  ansiedadXMovimiento =
    sk.lerp(
      ansiedadXMovimiento,
      movimientoX,
      0.15 +

    );


  ansiedadYMovimiento =
    sk.lerp(
      ansiedadYMovimiento,
      movimientoY,
      0.15 +
      ansiedadAlteracion * 0.08
    );


  var cambioTamano =
    sk.sin(
      sk.millis() *
      0.025 *
      ansiedadValor
    );


  ansiedadTamanoActual =
    ansiedadTamanoBase() +
    cambioTamano *
    ansiedadValor *
    ansiedadTamanoBase() *
    0.25;


  if (
    ansiedadValor <=

  ) {

    ansiedadValor = 0;

    ansiedadAlteracion = 0;

    ansiedadXMovimiento = 0;

    ansiedadYMovimiento = 0;

    ansiedadRotacion = 0;

    ansiedadTamanoActual =
      ansiedadTamanoBase();

    ansiedadRespirando = true;

    ansiedadTiempoRespiracion =
      sk.millis();
  }
}


// =====================================================
// TAMAÑO ADAPTATIVO
// =====================================================

function ansiedadTamanoBase() {

  return sk.min(
    sk.width,
    sk.height
  ) * 0.25;
}


// =====================================================
// RESPIRACIÓN
// =====================================================

function actualizarRespiracionAnsiedad() {

  var progreso =
    (
      sk.millis() -
      ansiedadTiempoRespiracion
    ) /
    ansiedadDuracionRespiracion;


  var respiracion =
    sk.sin(
      progreso *
      sk.TWO_PI *
      2
    );


  ansiedadOpacidad =
    sk.map(
      respiracion,
      -1,
      1,
      120,
      255
    );


  ansiedadTamanoActual =
    sk.map(
      respiracion,
      -1,
      1,
      ansiedadTamanoBase() * 0.97,
      ansiedadTamanoBase() * 1.03
    );


  ansiedadXMovimiento = 0;

  ansiedadYMovimiento = 0;

  ansiedadRotacion = 0;

  ansiedadAlteracion = 0;


  if (
    progreso >= 1
  ) {

    ansiedadRespirando = false;

    ansiedadRegresando = true;

    ansiedadValor = 0;
  }
}


// =====================================================
// REGRESO
// =====================================================

function actualizarRegresoAnsiedad() {

  ansiedadValor +=
    0.004;


  ansiedadValor =
    sk.constrain(
      ansiedadValor,
      0,
      1
    );


  ansiedadVelocidadMovimiento =
    sk.lerp(
      0,
      7,
      ansiedadValor
    );


  ansiedadVelocidadRotacion =
    sk.lerp(
      0,
      0.12,
      ansiedadValor
    );


  ansiedadIntensidadTitileo =
    sk.lerp(
      0.2,
      2.5,
      ansiedadValor
    );


  ansiedadIntensidadTemblor =
    sk.lerp(
      0,
      18,
      ansiedadValor
    );


  ansiedadRotacion +=
    ansiedadVelocidadRotacion;


  var movimientoX =
    sk.random(
      -ansiedadIntensidadTemblor,
      ansiedadIntensidadTemblor
    );


  var movimientoY =
    sk.random(
      -ansiedadIntensidadTemblor,
      ansiedadIntensidadTemblor
    );


  ansiedadXMovimiento =
    sk.lerp(
      ansiedadXMovimiento,
      movimientoX,
      0.15
    );


  ansiedadYMovimiento =
    sk.lerp(
      ansiedadYMovimiento,
      movimientoY,
      0.15
    );


  ansiedadTamanoActual =
    ansiedadTamanoBase() +
    sk.sin(
      sk.millis() *
      0.025 *
      ansiedadValor
    ) *
    ansiedadValor *
    ansiedadTamanoBase() *
    0.25;


  ansiedadOpacidad = 255;


  if (
    ansiedadValor >= 1
  ) {

    ansiedadValor = 1;

    ansiedadRegresando = false;
  }
}


// =====================================================
// TRIÁNGULO
// =====================================================

function dibujarTrianguloAnsiedad() {

  var titileo =
    sk.sin(
      sk.millis() *
      0.025 *
      ansiedadIntensidadTitileo
    );


  if (
    !ansiedadRespirando
  ) {

    ansiedadOpacidad =
      sk.map(
        titileo,
        -1,
        1,
        50,
        255
      );
  }


  var rojo =
    sk.lerp(
      150,
      255,
      ansiedadAlteracion
    );


  var verde =
    sk.lerp(
      50,
      0,
      ansiedadAlteracion
    );


  var azul =
    sk.lerp(
      220,
      0,
      ansiedadAlteracion
    );


  var x =
    sk.width / 2 +
    ansiedadXMovimiento;

  var y =
    sk.height / 2 +
    ansiedadYMovimiento;

  var tamano =
    ansiedadTamanoActual;


  sk.push();

  sk.translate(
    x,
    y
  );

  sk.rotate(
    ansiedadRotacion
  );

  sk.noStroke();


  // Aura cercana

  sk.fill(
    rojo,
    verde,
    azul,
    ansiedadOpacidad * 0.06
  );


  sk.triangle(
    0,
    -tamano / 2 - 25,

    -tamano / 2 - 25,
    tamano / 2 + 25,

    tamano / 2 + 25,
    tamano / 2 + 25
  );


  // Aura media

  sk.fill(
    rojo,
    verde,
    azul,
    ansiedadOpacidad * 0.035
  );


  sk.triangle(
    0,
    -tamano / 2 - 45,

    -tamano / 2 - 45,
    tamano / 2 + 45,

    tamano / 2 + 45,
    tamano / 2 + 45
  );


  // Triángulo principal

  sk.fill(
    rojo,
    verde,
    azul,
    ansiedadOpacidad
  );


  sk.triangle(
    0,
    -tamano / 2,

    -tamano / 2,
    tamano / 2,

    tamano / 2,
    tamano / 2
  );


  sk.pop();
}


// =====================================================
// INTERACCIÓN TÁCTIL
// =====================================================

function actualizarTouchAnsiedad() {

  ansiedadCalmando = false;


  // ---------------------------------------------------
  // Si no hay dedos
  // ---------------------------------------------------

  if (
    sk.touches.length == 0
  ) {

    ansiedadContactosAnteriores = [];

    return;
  }


  // ---------------------------------------------------
  // Buscar todos los dedos que estén sobre el triángulo
  // ---------------------------------------------------

  var contactosActuales = [];


  for (
    var i = 0;
    i < sk.touches.length;
    i++
  ) {

    var t =
      sk.touches[i];


    var distancia =
      sk.dist(
        t.x,
        t.y,
        sk.width / 2 +
        ansiedadXMovimiento,
        sk.height / 2 +
        ansiedadYMovimiento
      );


    if (
      distancia <
      ansiedadTamanoActual / 2
    ) {

      ansiedadCalmando = true;

      contactosActuales.push(
        t.id
      );


      // -----------------------------------------------
      // ¿Es un dedo nuevo?
      // -----------------------------------------------

      var contactoNuevo =
        ansiedadContactosAnteriores.indexOf(
          t.id
        ) == -1;


      if (
        contactoNuevo
      ) {

        procesarToqueAnsiedad();
      }
    }
  }


  ansiedadContactosAnteriores =
    contactosActuales;
}


// =====================================================
// PROCESAR TOQUE
// =====================================================

function procesarToqueAnsiedad() {

  if (
    ansiedadRespirando ||
    ansiedadRegresando
  ) {

    return;
  }


  var ahora =
    sk.millis();


  // Dos toques rápidos aumentan la ansiedad

  if (
    ahora -
    ansiedadUltimoClick <
    ansiedadIntervaloClick
  ) {

    ansiedadValor +=
      0.18;


    ansiedadAlteracion +=
      0.12;


    ansiedadValor =
      sk.constrain(
        ansiedadValor,
        0,
        1
      );


    ansiedadAlteracion =
      sk.constrain(
        ansiedadAlteracion,
        0,
        1
      );
  }


  ansiedadUltimoClick =
    ahora;
}


// =====================================================
// PRIMER TOQUE
// =====================================================

sk.touchStarted = function() {

  if (
    !ansiedadFullscreen
  ) {

    void 0;

    ansiedadFullscreen = true;
  }


  return false;
}


// =====================================================
// MOVIMIENTO DEL DEDO
// =====================================================

sk.touchMoved = function() {

  return false;
}


// =====================================================
// LEVANTAR DEDO
// =====================================================

sk.touchEnded = function() {

  return false;
}


// =====================================================
// CAMBIO DE TAMAÑO
// =====================================================

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );

  crearParticulasAnsiedad();

  ansiedadTamanoActual =
    ansiedadTamanoBase();
}
}
function sketch_expectativa(sk) {
var expectativaZoom = 1;
var expectativaVelocidadZoom = 0.004;
var expectativaRelacionPequeno = 0.025;
var expectativaTamanoBase = 900;

var expectativaNivel = 0;
var expectativaFondoGris = false;

var expectativaParticulas = [];
var expectativaCantidadParticulas = 100;

// CONTROL TÁCTIL
var expectativaArrastrando = false;
var expectativaUltimoY = 0;


sk.setup = function() {

  sk.createCanvas(_anchoVentana(sk), _altoVentana(sk));

  crearParticulasExpectativa();

  crearNivelExpectativa();
}


sk.draw = function() {

  var tamano =
    expectativaTamanoBase *
    expectativaRelacionPequeno *
    expectativaZoom;


  if (expectativaFondoGris) {

    dibujarFondoGris();

    dibujarTrianguloNegro(tamano);

    dibujarParticulasDentro(tamano);

  } else {

    sk.background(0);

    dibujarParticulasFondo();

    dibujarTrianguloGris(tamano);
  }
}


// ==============================
// FONDO GRIS
// ==============================

function dibujarFondoGris() {

  sk.background(90);

  var cx = sk.width / 2;
  var cy = sk.height / 2;

  var tamano =
    obtenerTamanoExpectativa();


  sk.noStroke();


  sk.fill(
    0,
    0,
    0,
    12
  );

  sk.triangle(
    cx,
    cy - tamano / 2 - 45,

    cx - tamano / 2 - 45,
    cy + tamano / 2 + 45,

    cx + tamano / 2 + 45,
    cy + tamano / 2 + 45
  );


  sk.fill(
    0,
    0,
    0,
    18
  );

  sk.triangle(
    cx,
    cy - tamano / 2 - 28,

    cx - tamano / 2 - 28,
    cy + tamano / 2 + 28,

    cx + tamano / 2 + 28,
    cy + tamano / 2 + 28
  );


  sk.fill(
    0,
    0,
    0,
    25
  );

  sk.triangle(
    cx,
    cy - tamano / 2 - 12,

    cx - tamano / 2 - 12,
    cy + tamano / 2 + 12,

    cx + tamano / 2 + 12,
    cy + tamano / 2 + 12
  );


  var pulso =
    sk.sin(sk.millis() * 0.002);


  var brillo =
    sk.map(
      pulso,
      -1,
      1,
      0,
      12
    );


  sk.fill(
    90 + brillo,
    90 + brillo,
    95 + brillo
  );


  sk.triangle(
    cx,
    cy - tamano / 2,

    cx - tamano / 2,
    cy + tamano / 2,

    cx + tamano / 2,
    cy + tamano / 2
  );
}


// ==============================
// TAMAÑO
// ==============================

function obtenerTamanoExpectativa() {

  return (
    expectativaTamanoBase *
    expectativaRelacionPequeno *
    expectativaZoom
  );
}


// ==============================
// TRIÁNGULO GRIS
// ==============================

function dibujarTrianguloGris(tamano) {

  var cx = sk.width / 2;
  var cy = sk.height / 2;


  var pulso =
    sk.sin(sk.millis() * 0.002);


  var brillo =
    sk.map(
      pulso,
      -1,
      1,
      0,
      12
    );


  sk.noStroke();


  sk.fill(
    120 + brillo,
    120 + brillo,
    125 + brillo,
    35
  );


  sk.triangle(
    cx,
    cy - tamano / 2 - 40,

    cx - tamano / 2 - 40,
    cy + tamano / 2 + 40,

    cx + tamano / 2 + 40,
    cy + tamano / 2 + 40
  );


  sk.fill(
    160 + brillo,
    160 + brillo,
    165 + brillo,
    55
  );


  sk.triangle(
    cx,
    cy - tamano / 2 - 25,

    cx - tamano / 2 - 25,
    cy + tamano / 2 + 25,

    cx + tamano / 2 + 25,
    cy + tamano / 2 + 25
  );


  sk.fill(
    200 + brillo,
    200 + brillo,
    205 + brillo,
    30
  );


  sk.triangle(
    cx,
    cy - tamano / 2 - 12,

    cx - tamano / 2 - 12,
    cy + tamano / 2 + 12,

    cx + tamano / 2 + 12,
    cy + tamano / 2 + 12
  );


  sk.fill(
    90 + brillo,
    90 + brillo,
    95 + brillo
  );


  sk.triangle(
    cx,
    cy - tamano / 2,

    cx - tamano / 2,
    cy + tamano / 2,

    cx + tamano / 2,
    cy + tamano / 2
  );
}


// ==============================
// TRIÁNGULO NEGRO
// ==============================

function dibujarTrianguloNegro(tamano) {

  var cx = sk.width / 2;
  var cy = sk.height / 2;


  sk.noStroke();

  sk.fill(0);


  sk.triangle(
    cx,
    cy - tamano / 2,

    cx - tamano / 2,
    cy + tamano / 2,

    cx + tamano / 2,
    cy + tamano / 2
  );
}


// ==============================
// PARTÍCULAS
// ==============================

function crearParticulasExpectativa() {

  expectativaParticulas = [];


  for (
    var i = 0;
    i < expectativaCantidadParticulas;
    i++
  ) {

    expectativaParticulas.push({

      x: sk.random(sk.width),

      y: sk.random(sk.height),

      vx: sk.random(
        -0.15,
        0.15
      ),

      vy: sk.random(
        -0.15,
        0.15
      ),

      tamano: sk.random(
        1,
        3
      ),

      opacidad: sk.random(
        20,
        70
      )
    });
  }
}


function actualizarParticula(p) {

  p.x += p.vx;
  p.y += p.vy;


  if (p.x < 0) {

    p.x = sk.width;
  }


  if (p.x > sk.width) {

    p.x = 0;
  }


  if (p.y < 0) {

    p.y = sk.height;
  }


  if (p.y > sk.height) {

    p.y = 0;
  }
}


function dibujarParticulasFondo() {

  sk.noStroke();


  for (
    var i = 0;
    i < expectativaParticulas.length;
    i++
  ) {

    var p =
      expectativaParticulas[i];


    actualizarParticula(p);


    sk.fill(
      170,
      170,
      180,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// ==============================
// DETECTAR PARTÍCULAS DENTRO
// ==============================

function puntoDentroTriangulo(
  px,
  py,
  tamano
) {

  var cx =
    sk.width / 2;

  var cy =
    sk.height / 2;


  var ax =
    cx;

  var ay =
    cy - tamano / 2;


  var bx =
    cx - tamano / 2;

  var by =
    cy + tamano / 2;


  var cX =
    cx + tamano / 2;

  var cY =
    cy + tamano / 2;


  var area =
    sk.abs(
      (
        ax * (by - cY) +
        bx * (cY - ay) +
        cX * (ay - by)
      ) / 2
    );


  var area1 =
    sk.abs(
      (
        px * (by - cY) +
        bx * (cY - py) +
        cX * (py - by)
      ) / 2
    );


  var area2 =
    sk.abs(
      (
        ax * (py - cY) +
        px * (cY - ay) +
        cX * (ay - py)
      ) / 2
    );


  var area3 =
    sk.abs(
      (
        ax * (by - py) +
        bx * (py - ay) +
        px * (ay - by)
      ) / 2
    );


  return (
    sk.abs(
      area -
      (
        area1 +
        area2 +
        area3
      )
    ) < 1
  );
}


function dibujarParticulasDentro(tamano) {

  sk.noStroke();


  for (
    var i = 0;
    i < expectativaParticulas.length;
    i++
  ) {

    var p =
      expectativaParticulas[i];


    actualizarParticula(p);


    if (
      puntoDentroTriangulo(
        p.x,
        p.y,
        tamano
      )
    ) {

      sk.fill(
        190,
        190,
        200,
        p.opacidad
      );


      sk.ellipse(
        p.x,
        p.y,
        p.tamano,
        p.tamano
      );
    }
  }
}


// ==============================
// CONTROL TÁCTIL
// ==============================

sk.touchStarted = function() {

  expectativaArrastrando = true;

  expectativaUltimoY = sk.touches.length > 0
    ? sk.touches[0].y
    : sk.mouseY;

  return false;
}


sk.touchMoved = function() {

  if (!expectativaArrastrando) {
    return false;
  }


  var actualY =
    sk.touches.length > 0
      ? sk.touches[0].y
      : sk.mouseY;


  var movimiento =
    expectativaUltimoY -
    actualY;


  expectativaZoom +=
    movimiento *
    expectativaVelocidadZoom *
    5;


  expectativaZoom =
    sk.constrain(
      expectativaZoom,
      1,
      45
    );


  expectativaUltimoY =
    actualY;


  if (
    expectativaZoom >= 45
  ) {

    crearNivelExpectativa();
  }


  return false;
}


sk.touchEnded = function() {

  expectativaArrastrando = false;

  return false;
}


// ==============================
// COMPATIBILIDAD CON MOUSE
// ==============================

sk.mousePressed = function() {

  expectativaArrastrando = true;

  expectativaUltimoY = sk.mouseY;
}


sk.mouseDragged = function() {

  if (!expectativaArrastrando) {
    return;
  }


  var movimiento =
    expectativaUltimoY -
    sk.mouseY;


  expectativaZoom +=
    movimiento *
    expectativaVelocidadZoom *
    5;


  expectativaZoom =
    sk.constrain(
      expectativaZoom,
      1,
      45
    );


  expectativaUltimoY =
    sk.mouseY;


  if (
    expectativaZoom >= 45
  ) {

    crearNivelExpectativa();
  }
}


sk.mouseReleased = function() {

  expectativaArrastrando = false;
}


// ==============================
// CAMBIO DE TAMAÑO DE PANTALLA
// ==============================

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );


  crearParticulasExpectativa();
}


// ==============================
// NUEVO NIVEL
// ==============================

function crearNivelExpectativa() {

  expectativaNivel++;

  expectativaZoom = 1;

  expectativaFondoGris =
    expectativaNivel % 2 === 0;
}
}

// =====================================================
// TAMAÑO "VENTANA" REDIRIGIDO AL CONTENEDOR
// =====================================================
// Los sketches originales usan windowWidth/windowHeight pensando en
// ocupar toda la pantalla. Acá los redirigimos al tamaño real de la
// celdita (mini-preview) o del recuadro de pantalla completa, para
// que cada una de las 9 instancias dibuje a la resolución que
// realmente necesita (y no a resolución de ventana completa x9).

function _anchoVentana(sk) {
  if (sk._contenedor) {
    return Math.max(1, Math.round(sk._contenedor.clientWidth));
  }
  return window.innerWidth;
}

function _altoVentana(sk) {
  if (sk._contenedor) {
    return Math.max(1, Math.round(sk._contenedor.clientHeight));
  }
  return window.innerHeight;
}

function envolverConContenedor(factory, contenedor) {
  return function (sk) {
    sk._contenedor = contenedor;
    factory(sk);
  };
}

// Las mini-previews de la grilla son puramente ambientales: no
// necesitan tocar/clickear nada. Si dejamos sus manejadores de
// touch/mouse originales (pensados para la versión de pantalla
// completa), en celulares el touchstart/touchmove del sketch de
// fondo puede hacer preventDefault() y cancelar el "click" que el
// navegador genera después de tocar, impidiendo abrir la celda.
// Por eso acá los anulamos apenas se crea la instancia.
function envolverParaPreview(factory, contenedor) {
  return function (sk) {
    sk._contenedor = contenedor;
    factory(sk);

    sk.touchStarted = undefined;
    sk.touchMoved = undefined;
    sk.touchEnded = undefined;
    sk.mousePressed = undefined;
    sk.mouseDragged = undefined;
    sk.mouseReleased = undefined;
    sk.mouseClicked = undefined;
    sk.keyPressed = undefined;
    sk.keyReleased = undefined;
  };
}

// =====================================================
// APP: panel 3x3 + pantalla completa
// =====================================================

var CONCEPTOS = [
  { id: "memoria",       nombre: "memoria",       factory: sketch_memoria },
  { id: "herencia",      nombre: "herencia",      factory: sketch_herencia },
  { id: "caducidad",     nombre: "caducidad",     factory: sketch_caducidad },
  { id: "identidad",     nombre: "identidad",     factory: sketch_identidad },
  { id: "empatia",       nombre: "empatía",       factory: sketch_empatia },
  { id: "colaboracion",  nombre: "colaboración",  factory: sketch_colaboracion },
  { id: "incertidumbre", nombre: "incertidumbre", factory: sketch_incertidumbre },
  { id: "ansiedad",      nombre: "ansiedad",      factory: sketch_ansiedad },
  { id: "expectativa",   nombre: "expectativa",   factory: sketch_expectativa }
];

var grid = document.getElementById("grid");
var fullscreen = document.getElementById("fullscreen");
var fsWrap = document.getElementById("fs-canvas-wrap");
var fsLabel = document.getElementById("fsLabel");
var menuBtn = document.getElementById("menuBtn");

var instanciaFullscreen = null;

CONCEPTOS.forEach(function (concepto, i) {

  var tile = document.createElement("div");
  tile.className = "tile";
  tile.setAttribute("role", "button");
  tile.setAttribute("tabindex", "0");
  tile.setAttribute("aria-label", "Abrir " + concepto.nombre);
  tile.dataset.id = concepto.id;

  var canvasWrap = document.createElement("div");
  canvasWrap.className = "canvas-wrap";
  tile.appendChild(canvasWrap);

  var veil = document.createElement("div");
  veil.className = "veil";
  tile.appendChild(veil);

  var label = document.createElement("div");
  label.className = "label";

  var num = document.createElement("span");
  num.className = "num";
  num.textContent = String(i + 1).padStart(2, "0");

  var name = document.createElement("span");
  name.className = "name";
  name.textContent = concepto.nombre;

  label.appendChild(num);
  label.appendChild(name);
  tile.appendChild(label);

  grid.appendChild(tile);

  // Mini sketch ambiental, no interactivo (el canvas tiene pointer-events:none)
  try {
    new p5(envolverParaPreview(concepto.factory, canvasWrap), canvasWrap);
  } catch (e) {
    console.error("Error iniciando preview de " + concepto.id, e);
  }

  function abrir() {
    abrirPantallaCompleta(concepto);
  }

  // En algunos navegadores móviles el "click" sintético después de
  // un toque puede no dispararse. Usamos touchend como vía directa
  // y evitamos que despue el click duplique la apertura.
  var abiertoPorTouch = false;

  tile.addEventListener(
    "touchend",
    function (e) {
      e.preventDefault();
      abiertoPorTouch = true;
      abrir();
      setTimeout(function () {
        abiertoPorTouch = false;
      }, 600);
    },
    { passive: false }
  );

  tile.addEventListener("click", function () {
    if (abiertoPorTouch) {
      return;
    }
    abrir();
  });

  tile.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      abrir();
    }
  });
});

function abrirPantallaCompleta(concepto) {

  if (instanciaFullscreen) {
    instanciaFullscreen.remove();
    instanciaFullscreen = null;
  }

  fsWrap.innerHTML = "";
  fsLabel.textContent = concepto.nombre;

  instanciaFullscreen = new p5(envolverConContenedor(concepto.factory, fsWrap), fsWrap);

  fullscreen.classList.add("open");
  document.body.style.overflow = "hidden";
}

function cerrarPantallaCompleta() {

  if (instanciaFullscreen) {
    instanciaFullscreen.remove();
    instanciaFullscreen = null;
  }

  fsWrap.innerHTML = "";
  fullscreen.classList.remove("open");
  document.body.style.overflow = "";
}

// El sketch activo en pantalla completa escucha eventos táctiles
// clásicos (touchstart/touchmove/touchend) a nivel de documento, y
// eso puede tragarse el toque incluso cuando el dedo cae sobre el
// botón de menú. Los Pointer Events son un sistema aparte que los
// sketches nunca usan, así que no pueden interceptarlo: por eso el
// botón se maneja principalmente con "pointerup".
var menuYaAccionado = false;

function activarMenuYaAccionado() {
  menuYaAccionado = true;
  setTimeout(function () {
    menuYaAccionado = false;
  }, 600);
}

if (window.PointerEvent) {

  menuBtn.addEventListener(
    "pointerup",
    function (e) {
      e.preventDefault();
      activarMenuYaAccionado();
      cerrarPantallaCompleta();
    },
    { passive: false }
  );
}

// Respaldo para navegadores sin Pointer Events (muy poco comunes).
menuBtn.addEventListener(
  "touchend",
  function (e) {
    if (menuYaAccionado) {
      return;
    }
    e.preventDefault();
    activarMenuYaAccionado();
    cerrarPantallaCompleta();
  },
  { passive: false }
);

menuBtn.addEventListener("click", function () {
  if (menuYaAccionado) {
    return;
  }
  cerrarPantallaCompleta();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && fullscreen.classList.contains("open")) {
    cerrarPantallaCompleta();
  }
});

</script>
