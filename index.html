<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TP 2: Grupo 6</title>
<style>
  :root{
    --bg:#050505;
    --panel:#0b0b0d;
    --line: rgba(255,255,255,0.08);
    --violet:#9632DC;
    --violet-soft: rgba(150,50,220,0.35);
    --text: #e9e6ee;
    --text-dim: #8b8894;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow-x:hidden;
    height:100%;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding: clamp(20px, 4vw, 40px) clamp(20px, 4vw, 48px) 8px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  header h1{
    font-size: clamp(20px, 2.4vw, 30px);
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }

  header h1 .dot{ color:var(--violet); }

  header p{
    margin:0;
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  #grid{
    flex:1;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    align-content: start;
    gap:1px;
    background:var(--line);
    margin: clamp(16px,3vw,32px);
    border:1px solid var(--line);
  }

  .tile{
    position:relative;
    background:var(--panel);
    aspect-ratio: 1 / 1;
    cursor:pointer;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .tile .canvas-wrap{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .tile .canvas-wrap canvas{
    display:block !important;
    width:100% !important;
    height:100% !important;
  }

  .tile .veil{
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%);
    transition: background 0.25s ease;
  }

  .tile:hover .veil, .tile:focus-visible .veil{
    background: linear-gradient(180deg, rgba(150,50,220,0.06) 0%, rgba(0,0,0,0.55) 100%);
  }

  .tile:hover, .tile:focus-visible{
    outline:none;
  }

  .tile::after{
    content:"";
    position:absolute;
    inset:0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0);
    transition: box-shadow 0.25s ease;
    pointer-events:none;
  }

  .tile:hover::after, .tile:focus-visible::after{
    box-shadow: inset 0 0 0 1px var(--violet-soft);
  }

  .tile .label{
    position:absolute;
    left:0; right:0; bottom:0;
    padding: 14px 16px;
    display:flex;
    align-items:baseline;
    gap:10px;
    z-index:2;
  }

  .tile .num{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.08em;
  }

  .tile .name{
    font-size: clamp(13px, 1.6vw, 17px);
    font-weight:600;
    letter-spacing:0.01em;
    text-transform:lowercase;
  }

  footer{
    padding: 10px clamp(20px,4vw,48px) clamp(18px,3vw,28px);
    color:var(--text-dim);
    font-size:12px;
    letter-spacing:0.02em;
  }

  /* ---------- Fullscreen ---------- */

  #fullscreen{
    position:fixed;
    inset:0;
    background:#000;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease;
  }

  #fullscreen.open{
    opacity:1;
    pointer-events:auto;
  }

  #fs-canvas-wrap{
    width:min(94vw, 94vh);
    height:min(94vw, 94vh);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #fs-canvas-wrap canvas{
    display:block !important;
    width:100% !important;
    height:100% !important;
  }

  #menuBtn{
    position:fixed;
    top: clamp(14px,2.4vw,28px);
    left: clamp(14px,2.4vw,28px);
    z-index:60;
    background: rgba(20,20,22,0.75);
    backdrop-filter: blur(6px);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    letter-spacing:0.04em;
    padding:10px 16px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }

  #menuBtn:hover{
    border-color: var(--violet-soft);
    color:#fff;
  }

  #menuBtn svg{ width:14px; height:14px; }

  #fsLabel{
    position:fixed;
    top: clamp(14px,2.4vw,28px);
    right: clamp(14px,2.4vw,28px);
    z-index:60;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  @media (max-width: 640px){
    #grid{ grid-template-columns: repeat(3, 1fr); gap:1px; margin:10px; }
    .tile .name{ font-size:12px; }
    .tile .label{ padding:8px 9px; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
function sketch_memoria(sk) {
let x = [300, 420, 300, 180];
let y = [180, 300, 420, 300];

let alpha = [255, 255, 255, 255];
let alphaObjetivo = [255, 255, 255, 255];

let patron = [0, 0, 0, 0];

let fase = 1;
let posicionJugador = 0;

let INICIO_MEMORIA = 0;
let MOSTRANDO_PATRON = 1;
let ESPERANDO_JUGADOR = 2;
let ERROR = 3;
let PAUSA_ENTRE_FASES = 4;
let PAUSA_REINICIO = 5;
let GANASTE = 6;

let estadoJuego = INICIO_MEMORIA;

let tiempo = 0;
let pasoPatron = 0;

let botonIncorrecto = -1;

let velocidadDesaparecer = 12;
let velocidadAparecer = 6;

let duracionInicioMemoria = 1000;

let particulasMemoria = [];
let cantidadParticulasMemoria = 90;

let escalaMemoria = 1;
let offsetXMemoria = 0;
let offsetYMemoria = 0;

let iniciadoFullscreen = false;


// =====================================================
// TIEMPO DE RESPUESTA
// =====================================================

let tiempoInicioRespuestaMemoria = 0;
let limiteEsperaMemoria = 7000;


// =====================================================
// LATIDO
// =====================================================

let circuloLatidoMemoria = -1;
let tiempoLatidoMemoria = 0;
let duracionLatidoMemoria = 500;


// =====================================================
// SETUP
// =====================================================

sk.setup = function() {

  sk.createCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );

  calcularEscalaMemoria();

  crearParticulasMemoria();

  empezarJuego();
}


// =====================================================
// DRAW
// =====================================================

sk.draw = function() {

  sk.background(0);

  calcularEscalaMemoria();

  dibujarFondoMemoria();


  sk.push();

  sk.translate(
    offsetXMemoria,
    offsetYMemoria
  );

  sk.scale(
    escalaMemoria
  );


  // ===================================================
  // ANIMACION DE OPACIDAD
  // ===================================================

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    if (
      alpha[i] <
      alphaObjetivo[i]
    ) {

      alpha[i] +=
        velocidadAparecer;


      if (
        alpha[i] >
        alphaObjetivo[i]
      ) {

        alpha[i] =
          alphaObjetivo[i];
      }
    }

    else if (
      alpha[i] >
      alphaObjetivo[i]
    ) {

      alpha[i] -=
        velocidadDesaparecer;


      if (
        alpha[i] <
        alphaObjetivo[i]
      ) {

        alpha[i] =
          alphaObjetivo[i];
      }
    }
  }


  // ===================================================
  // CIRCULOS
  // ===================================================

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    let haciendoLatido =
      i ===
      circuloLatidoMemoria &&
      sk.millis() -
      tiempoLatidoMemoria <
      duracionLatidoMemoria;


    if (
      haciendoLatido
    ) {

      let progreso =
        (
          sk.millis() -
          tiempoLatidoMemoria
        ) /
        duracionLatidoMemoria;


      let pulso =
        sk.sin(
          progreso *
          sk.PI
        );


      let escalaPulso =
        1 +
        pulso *
        0.18;


      dibujarCirculoNeonMemoria(
        x[i],
        y[i],
        80 *
        escalaPulso,
        150,
        50,
        220
      );

    }

    else {

      dibujarCirculoMemoria(
        x[i],
        y[i],
        80,
        alpha[i]
      );
    }
  }


  // ===================================================
  // INICIO
  // ===================================================

  if (
    estadoJuego ===
    INICIO_MEMORIA
  ) {

    if (
      sk.millis() -
      tiempo >=
      duracionInicioMemoria
    ) {

      estadoJuego =
        MOSTRANDO_PATRON;

      tiempo =
        sk.millis();

      pasoPatron = 0;
    }


    sk.pop();

    return;
  }


  // ===================================================
  // MOSTRAR PATRON
  // ===================================================

  if (
    estadoJuego ===
    MOSTRANDO_PATRON
  ) {

    let circulo =
      patron[pasoPatron];


    dibujarCirculoNeonMemoria(
      x[circulo],
      y[circulo],
      80,
      150,
      50,
      220
    );


    if (
      sk.millis() -
      tiempo >
      500
    ) {

      pasoPatron++;


      if (
        pasoPatron <
        fase
      ) {

        tiempo =
          sk.millis();

      }

      else {

        pasoPatron = 0;

        posicionJugador = 0;

        estadoJuego =
          ESPERANDO_JUGADOR;


        // Comienza a contar los 7 segundos

        tiempoInicioRespuestaMemoria =
          sk.millis();
      }
    }
  }


  // ===================================================
  // ESPERAR AL JUGADOR
  // ===================================================

  if (
    estadoJuego ===
    ESPERANDO_JUGADOR
  ) {

    // Si pasan 7 segundos sin interacción,
    // vuelve a mostrar el patrón.

    if (
      sk.millis() -
      tiempoInicioRespuestaMemoria >=
      limiteEsperaMemoria
    ) {

      mostrarPatronDeNuevoMemoria();
    }
  }


  // ===================================================
  // ERROR
  // ===================================================

  if (
    estadoJuego ===
    ERROR
  ) {

    dibujarCirculoNeonMemoria(
      x[botonIncorrecto],
      y[botonIncorrecto],
      80,
      255,
      0,
      0
    );


    if (
      sk.millis() -
      tiempo >
      3000
    ) {

      estadoJuego =
        PAUSA_REINICIO;

      tiempo =
        sk.millis();
    }
  }


  // ===================================================
  // PAUSA REINICIO
  // ===================================================

  if (
    estadoJuego ===
    PAUSA_REINICIO
  ) {

    if (
      sk.millis() -
      tiempo >
      100
    ) {

      empezarJuego();
    }
  }


  // ===================================================
  // PAUSA ENTRE FASES
  // ===================================================

  if (
    estadoJuego ===
    PAUSA_ENTRE_FASES
  ) {

    if (
      sk.millis() -
      tiempo >
      3000
    ) {

      prepararSiguienteFase();
    }
  }


  // ===================================================
  // GANASTE
  // ===================================================

  if (
    estadoJuego ===
    GANASTE
  ) {

    if (
      sk.millis() -
      tiempo >
      3000
    ) {

      empezarJuego();
    }
  }


  sk.pop();
}


// =====================================================
// ESCALA
// =====================================================

function calcularEscalaMemoria() {

  let espacioDisponible =
    sk.min(
      sk.width,
      sk.height
    );


  escalaMemoria =
    (
      espacioDisponible *
      0.90
    ) /
    600;


  offsetXMemoria =
    (
      sk.width -
      600 *
      escalaMemoria
    ) /
    2;


  offsetYMemoria =
    (
      sk.height -
      600 *
      escalaMemoria
    ) /
    2;
}


// =====================================================
// PARTICULAS
// =====================================================

function crearParticulasMemoria() {

  particulasMemoria = [];


  for (
    let i = 0;
    i < cantidadParticulasMemoria;
    i++
  ) {

    particulasMemoria.push({

      x:
        sk.random(sk.width),

      y:
        sk.random(sk.height),

      velocidadX:
        sk.random(
          -0.15,
          0.15
        ),

      velocidadY:
        sk.random(
          -0.15,
          0.15
        ),

      tamano:
        sk.random(
          1,
          3
        ),

      opacidad:
        sk.random(
          20,
          80
        )
    });
  }
}


function dibujarFondoMemoria() {

  sk.noStroke();


  for (
    let particula of particulasMemoria
  ) {

    particula.x +=
      particula.velocidadX;

    particula.y +=
      particula.velocidadY;


    if (
      particula.x < 0
    ) {

      particula.x =
        sk.width;
    }


    if (
      particula.x > sk.width
    ) {

      particula.x =
        0;
    }


    if (
      particula.y < 0
    ) {

      particula.y =
        sk.height;
    }


    if (
      particula.y > sk.height
    ) {

      particula.y =
        0;
    }


    sk.fill(
      150,
      150,
      160,
      particula.opacidad
    );


    sk.ellipse(
      particula.x,
      particula.y,
      particula.tamano,
      particula.tamano
    );
  }
}


// =====================================================
// CIRCULO NORMAL
// =====================================================

function dibujarCirculoMemoria(
  posX,
  posY,
  tamano,
  opacidad
) {

  sk.noStroke();


  sk.fill(
    255,
    255,
    255,
    opacidad * 0.08
  );


  sk.ellipse(
    posX,
    posY,
    tamano + 18,
    tamano + 18
  );


  sk.fill(
    255,
    255,
    255,
    opacidad
  );


  sk.ellipse(
    posX,
    posY,
    tamano,
    tamano
  );
}


// =====================================================
// CIRCULO NEON
// =====================================================

function dibujarCirculoNeonMemoria(
  posX,
  posY,
  tamano,
  rojo,
  verde,
  azul
) {

  sk.noStroke();


  sk.fill(
    rojo,
    verde,
    azul,
    25
  );


  sk.ellipse(
    posX,
    posY,
    tamano + 60,
    tamano + 60
  );


  sk.fill(
    rojo,
    verde,
    azul,
    55
  );


  sk.ellipse(
    posX,
    posY,
    tamano + 35,
    tamano + 35
  );


  sk.fill(
    rojo,
    verde,
    azul,
    100
  );


  sk.ellipse(
    posX,
    posY,
    tamano + 15,
    tamano + 15
  );


  sk.fill(
    rojo,
    verde,
    azul
  );


  sk.ellipse(
    posX,
    posY,
    tamano,
    tamano
  );
}


// =====================================================
// PROCESAR SELECCION
// =====================================================

function procesarSeleccionMemoria(
  posX,
  posY
) {

  if (
    estadoJuego !==
    ESPERANDO_JUGADOR
  ) {

    return;
  }


  let escala =
    escalaMemoria;


  let posicionVirtualX =
    (
      posX -
      offsetXMemoria
    ) /
    escala;


  let posicionVirtualY =
    (
      posY -
      offsetYMemoria
    ) /
    escala;


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    let distancia =
      sk.dist(
        posicionVirtualX,
        posicionVirtualY,
        x[i],
        y[i]
      );


    if (
      distancia <
      40
    ) {

      // Reinicia el contador cada vez
      // que el jugador responde.

      tiempoInicioRespuestaMemoria =
        sk.millis();


      // ---------------------------------------------
      // RESPUESTA CORRECTA
      // ---------------------------------------------

      if (
        i ===
        patron[posicionJugador]
      ) {

        alphaObjetivo[i] =
          0;


        circuloLatidoMemoria =
          i;


        tiempoLatidoMemoria =
          sk.millis();


        posicionJugador++;


        if (
          posicionJugador ===
          fase
        ) {

          if (
            fase < 4
          ) {

            fase++;

            agregarBoton();

            estadoJuego =
              PAUSA_ENTRE_FASES;

            tiempo =
              sk.millis();

          }

          else {

            estadoJuego =
              GANASTE;

            tiempo =
              sk.millis();
          }
        }

      }

      // ---------------------------------------------
      // RESPUESTA INCORRECTA
      // ---------------------------------------------

      else {

        botonIncorrecto =
          i;

        estadoJuego =
          ERROR;

        tiempo =
          sk.millis();
      }


      return;
    }
  }
}


// =====================================================
// MOSTRAR PATRON NUEVAMENTE
// =====================================================

function mostrarPatronDeNuevoMemoria() {

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    alphaObjetivo[i] =
      255;
  }


  posicionJugador = 0;

  pasoPatron = 0;


  estadoJuego =
    MOSTRANDO_PATRON;


  tiempo =
    sk.millis();


  circuloLatidoMemoria =
    -1;


  tiempoInicioRespuestaMemoria =
    sk.millis();
}


// =====================================================
// MOUSE
// =====================================================

sk.mousePressed = function() {

  activarFullscreenMemoria();


  procesarSeleccionMemoria(
    sk.mouseX,
    sk.mouseY
  );
}


// =====================================================
// TOUCH
// =====================================================

sk.touchStarted = function() {

  activarFullscreenMemoria();


  if (
    sk.touches.length > 0
  ) {

    procesarSeleccionMemoria(
      sk.touches[0].x,
      sk.touches[0].y
    );
  }


  return false;
}


// =====================================================
// FULLSCREEN
// =====================================================

function activarFullscreenMemoria() {

  if (
    !iniciadoFullscreen
  ) {

    void 0;

    iniciadoFullscreen =
      true;
  }
}


// =====================================================
// TECLADO
// =====================================================

sk.keyPressed = function() {

  if (
    sk.keyCode === sk.ESCAPE
  ) {

    void 0;

    iniciadoFullscreen =
      false;
  }
}


// =====================================================
// CAMBIO DE TAMAÑO
// =====================================================

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );


  calcularEscalaMemoria();
}


// =====================================================
// PATRON
// =====================================================

function agregarBoton() {

  let nuevo;


  do {

    nuevo =
      sk.floor(
        sk.random(4)
      );

  } while (
    estaEnPatron(nuevo)
  );


  patron[
    fase - 1
  ] =
    nuevo;
}


function estaEnPatron(
  numero
) {

  for (
    let i = 0;
    i < fase - 1;
    i++
  ) {

    if (
      patron[i] ===
      numero
    ) {

      return true;
    }
  }


  return false;
}


// =====================================================
// SIGUIENTE FASE
// =====================================================

function prepararSiguienteFase() {

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    alphaObjetivo[i] =
      255;
  }


  posicionJugador = 0;

  pasoPatron = 0;

  circuloLatidoMemoria =
    -1;


  estadoJuego =
    MOSTRANDO_PATRON;


  tiempo =
    sk.millis();
}


// =====================================================
// EMPEZAR JUEGO
// =====================================================

function empezarJuego() {

  fase = 1;

  posicionJugador = 0;

  pasoPatron = 0;

  botonIncorrecto = -1;

  circuloLatidoMemoria =
    -1;


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    alpha[i] = 0;

    alphaObjetivo[i] =
      255;
  }


  patron[0] =
    sk.floor(
      sk.random(4)
    );


  estadoJuego =
    INICIO_MEMORIA;


  tiempo =
    sk.millis();


  tiempoInicioRespuestaMemoria =
    sk.millis();
}
}
function sketch_herencia(sk) {
var herenciaPadre;

var herenciaPadreYInicio = 180;

var herenciaHerederos = [];

var herenciaParticulas = [];

var herenciaParticulasFondo = [];

var herenciaSeleccionado = null;

var herenciaEstado = "jugando";

var herenciaArrastrando = false;

var herenciaTiempoEstado = 0;


// =====================================================
// TOUCH
// =====================================================

var herenciaTouchID = -1;

var herenciaFullscreen = false;

var lienzo;


// DURACIONES

var herenciaDuracionSalida = 1200;

var herenciaDuracionHerencia = 1000;

var herenciaDuracionNuevos = 1200;


// TAMAÑOS

var herenciaTamanoPadre = 180;

var herenciaCantidadHerederos = 4;

var herenciaCantidadParticulas = 35;

var herenciaCantidadParticulasFondo = 100;


// =====================================================
// SETUP
// =====================================================

sk.setup = function() {

  lienzo = sk.createCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );

  lienzo.elt.style.touchAction = "none";

  crearParticulasFondoHerencia();

  iniciarHerencia();
}


// =====================================================
// DRAW
// =====================================================

sk.draw = function() {

  sk.background(0);

  dibujarFondoHerencia();


  actualizarTouchHerencia();


  // -----------------------------------------------------
  // RED DE SEGURIDAD:
  // ninguna fase de transición (salida/herencia/nuevos) debería
  // durar más de ~1.2s. Si por algún motivo (rendimiento, un
  // toque perdido, etc.) queda trabada mucho más que eso, forzamos
  // un reinicio limpio para que el usuario pueda seguir probando.
  // -----------------------------------------------------

  if (
    herenciaEstado !== "jugando" &&
    sk.millis() - herenciaTiempoEstado > 6000
  ) {

    iniciarHerencia();
  }


  if (
    herenciaEstado === "jugando"
  ) {

    actualizarPadreHerencia();

    actualizarParticulasHerencia();

    actualizarEscalaHerederosHerencia();

    comprobarColisionParticulasHerencia();

    dibujarPadreHerencia();

    dibujarParticulasHerencia();

    dibujarHerederosHerencia();
  }


  else if (
    herenciaEstado === "salida"
  ) {

    actualizarSalidaHerencia();

    dibujarPadreHerencia();

    dibujarParticulasHerencia();

    dibujarHerederosHerencia();
  }


  else if (
    herenciaEstado === "herencia"
  ) {

    actualizarHerenciaHerencia();

    dibujarPadreHerencia();

    dibujarParticulasHerencia();

    dibujarHerederosHerencia();
  }


  else if (
    herenciaEstado === "nuevos"
  ) {

    actualizarNuevosHerederosHerencia();

    dibujarPadreHerencia();

    dibujarParticulasHerencia();

    dibujarHerederosHerencia();
  }
}


// =====================================================
// INICIAR
// =====================================================

function iniciarHerencia() {

  herenciaEstado = "jugando";

  herenciaSeleccionado = null;

  herenciaArrastrando = false;

  herenciaTouchID = -1;

  herenciaTiempoEstado = sk.millis();

  crearPadreHerencia();

  crearHerederosHerencia();
}


// =====================================================
// PADRE
// =====================================================

// =====================================================
// POSICION VERTICAL DEL PADRE (RESPONSIVE)
// =====================================================

function calcularYPadreHerencia() {

  return sk.constrain(
    sk.height * 0.22,
    herenciaTamanoPadre / 2 + 15,
    180
  );
}


function crearPadreHerencia() {

  herenciaPadre = {

    x: sk.width / 2,

    y: calcularYPadreHerencia(),

    tamano: herenciaTamanoPadre
  };


  crearParticulasDelPadre();
}


function crearParticulasDelPadre() {

  herenciaParticulas = [];


  for (
    var i = 0;
    i < herenciaCantidadParticulas;
    i++
  ) {

    var angulo =
      sk.random(sk.TWO_PI);


    var distancia =
      sk.random(
        herenciaPadre.tamano / 2 + 15,
        herenciaPadre.tamano / 2 + 75
      );


    herenciaParticulas.push({

      x:
        herenciaPadre.x +
        sk.cos(angulo) *
        distancia,

      y:
        herenciaPadre.y +
        sk.sin(angulo) *
        distancia,

      angulo: angulo,

      distancia: distancia,

      velocidad:
        sk.random(
          0.005,
          0.018
        ),

      tamano:
        sk.random(
          5,
          9
        )
    });
  }
}


function actualizarPadreHerencia() {

  if (
    herenciaPadre === null
  ) {

    return;
  }


  for (
    var i = 0;
    i < herenciaParticulas.length;
    i++
  ) {

    var p =
      herenciaParticulas[i];


    p.angulo +=
      p.velocidad;


    p.x =
      herenciaPadre.x +
      sk.cos(p.angulo) *
      p.distancia;


    p.y =
      herenciaPadre.y +
      sk.sin(p.angulo) *
      p.distancia;
  }
}


function actualizarParticulasHerencia() {

  if (
    herenciaPadre === null
  ) {

    return;
  }


  for (
    var i = 0;
    i < herenciaParticulas.length;
    i++
  ) {

    var p =
      herenciaParticulas[i];


    p.angulo +=
      p.velocidad;


    p.x =
      herenciaPadre.x +
      sk.cos(p.angulo) *
      p.distancia;


    p.y =
      herenciaPadre.y +
      sk.sin(p.angulo) *
      p.distancia;
  }
}


// =====================================================
// HEREDEROS
// =====================================================

function crearHerederosHerencia() {

  herenciaHerederos = [];


  var posiciones = [

    {
      x: sk.width * 0.18,
      y: sk.height * 0.85
    },

    {
      x: sk.width * 0.40,
      y: sk.height * 0.90
    },

    {
      x: sk.width * 0.60,
      y: sk.height * 0.90
    },

    {
      x: sk.width * 0.82,
      y: sk.height * 0.85
    }

  ];


  for (
    var i = 0;
    i < herenciaCantidadHerederos;
    i++
  ) {

    herenciaHerederos.push({

      x:
        posiciones[i].x,

      y:
        posiciones[i].y,

      posicionFinalX:
        posiciones[i].x,

      posicionFinalY:
        posiciones[i].y,

      yInicial:
        sk.height + 100,

      tamano:
        sk.random(
          40,
          58
        ),

      escala: 1,

      opacidad: 255,

      rojo: 150,

      verde: 150,

      azul: 155,

      elegido: false,

      nuevo: false
    });
  }
}


// =====================================================
// ESCALA SEGUN CERCANIA AL PADRE
// (el heredero agarrado crece a medida que se acerca)
// =====================================================

function actualizarEscalaHerederosHerencia() {

  for (
    var i = 0;
    i < herenciaHerederos.length;
    i++
  ) {

    var h =
      herenciaHerederos[i];


    if (
      herenciaArrastrando &&
      h === herenciaSeleccionado &&
      herenciaPadre !== null
    ) {

      var distanciaActual =
        sk.dist(
          h.x,
          h.y,
          herenciaPadre.x,
          herenciaPadre.y
        );


      var distanciaInicial =
        sk.dist(
          h.posicionFinalX,
          h.posicionFinalY,
          herenciaPadre.x,
          herenciaPadre.y
        );


      var proximidad =
        distanciaInicial > 0
          ? 1 -
            sk.constrain(
              distanciaActual /
              distanciaInicial,
              0,
              1
            )
          : 0;


      var escalaObjetivo =
        sk.lerp(
          1,
          1.6,
          proximidad
        );


      h.escala =
        sk.lerp(
          h.escala,
          escalaObjetivo,
          0.35
        );

    }

    else {

      h.escala =
        sk.lerp(
          h.escala,
          1,
          0.2
        );
    }
  }
}


// =====================================================
// COLISION CON EL PADRE
// (se pisa el circulo padre en si, no su aura de particulas)
// =====================================================

function comprobarColisionParticulasHerencia() {

  if (
    herenciaSeleccionado === null
  ) {

    return;
  }


  if (
    !herenciaArrastrando
  ) {

    return;
  }


  if (
    herenciaEstado !== "jugando"
  ) {

    return;
  }


  var distancia =
    sk.dist(
      herenciaSeleccionado.x,
      herenciaSeleccionado.y,
      herenciaPadre.x,
      herenciaPadre.y
    );


  if (
    distancia <
    herenciaSeleccionado.tamano *
    herenciaSeleccionado.escala /
    2 +
    herenciaPadre.tamano /
    2
  ) {

    comenzarSalidaHerencia();
  }
}


// =====================================================
// COMIENZA SALIDA
// =====================================================

function comenzarSalidaHerencia() {

  herenciaEstado =
    "salida";


  herenciaTiempoEstado =
    sk.millis();


  herenciaPadreYInicio =
    herenciaPadre.y;


  herenciaSeleccionado.elegido =
    true;


  herenciaArrastrando =
    false;


  herenciaTouchID =
    -1;
}


// =====================================================
// ETAPA 1
// REY ARRIBA / OTROS A LOS LADOS
// =====================================================

function actualizarSalidaHerencia() {

  var progreso =
    (
      sk.millis() -
      herenciaTiempoEstado
    ) /
    herenciaDuracionSalida;


  progreso =
    sk.constrain(
      progreso,
      0,
      1
    );


  var suave =
    progreso *
    progreso *
    (3 - 2 * progreso);


  herenciaPadre.y =
    sk.lerp(
      herenciaPadreYInicio,
      -220,
      suave
    );


  for (
    var i = 0;
    i < herenciaHerederos.length;
    i++
  ) {

    var h =
      herenciaHerederos[i];


    if (
      h ===
      herenciaSeleccionado
    ) {

      continue;
    }


    if (
      i < 2
    ) {

      h.x =
        sk.lerp(
          h.x,
          -180,
          suave
        );

    }

    else {

      h.x =
        sk.lerp(
          h.x,
          sk.width + 180,
          suave
        );
    }
  }


  if (
    progreso >= 1
  ) {

    herenciaEstado =
      "herencia";


    herenciaTiempoEstado =
      sk.millis();
  }
}


// =====================================================
// ETAPA 2
// EL ELEGIDO SE CONVIERTE
// =====================================================

function actualizarHerenciaHerencia() {

  var progreso =
    (
      sk.millis() -
      herenciaTiempoEstado
    ) /
    herenciaDuracionHerencia;


  progreso =
    sk.constrain(
      progreso,
      0,
      1
    );


  var suave =
    progreso *
    progreso *
    (3 - 2 * progreso);


  var elegido =
    herenciaSeleccionado;


  elegido.x =
    sk.lerp(
      elegido.x,
      sk.width / 2,
      suave
    );


  elegido.y =
    sk.lerp(
      elegido.y,
      calcularYPadreHerencia(),
      suave
    );


  elegido.escala =
    sk.lerp(
      1,
      herenciaTamanoPadre /
      elegido.tamano,
      suave
    );


  elegido.rojo =
    sk.lerp(
      150,
      150,
      suave
    );


  elegido.verde =
    sk.lerp(
      150,
      50,
      suave
    );


  elegido.azul =
    sk.lerp(
      155,
      220,
      suave
    );


  if (
    progreso >= 1
  ) {

    herenciaPadre = {

      x: sk.width / 2,

      y: calcularYPadreHerencia(),

      tamano: herenciaTamanoPadre
    };


    crearParticulasDelPadre();


    herenciaSeleccionado =
      null;

    herenciaArrastrando =
      false;

    herenciaTouchID =
      -1;


    herenciaEstado =
      "nuevos";


    herenciaTiempoEstado =
      sk.millis();


    prepararNuevosHerederosHerencia();
  }
}


// =====================================================
// ETAPA 3
// NUEVOS HEREDEROS DESDE ABAJO
// =====================================================

function prepararNuevosHerederosHerencia() {

  var posiciones = [

    {
      x: sk.width * 0.18,
      y: sk.height * 0.85
    },

    {
      x: sk.width * 0.40,
      y: sk.height * 0.90
    },

    {
      x: sk.width * 0.60,
      y: sk.height * 0.90
    },

    {
      x: sk.width * 0.82,
      y: sk.height * 0.85
    }

  ];


  herenciaHerederos = [];


  for (
    var i = 0;
    i < herenciaCantidadHerederos;
    i++
  ) {

    herenciaHerederos.push({

      x:
        posiciones[i].x,

      y:
        sk.height + 100,

      posicionFinalX:
        posiciones[i].x,

      posicionFinalY:
        posiciones[i].y,

      tamano:
        sk.random(
          40,
          58
        ),

      escala: 1,

      opacidad: 255,

      rojo: 150,

      verde: 150,

      azul: 155,

      elegido: false,

      nuevo: true
    });
  }
}


function actualizarNuevosHerederosHerencia() {

  var progreso =
    (
      sk.millis() -
      herenciaTiempoEstado
    ) /
    herenciaDuracionNuevos;


  progreso =
    sk.constrain(
      progreso,
      0,
      1
    );


  var suave =
    progreso *
    progreso *
    (3 - 2 * progreso);


  for (
    var i = 0;
    i < herenciaHerederos.length;
    i++
  ) {

    var h =
      herenciaHerederos[i];


    h.x =
      sk.lerp(
        h.x,
        h.posicionFinalX,
        suave
      );


    h.y =
      sk.lerp(
        h.y,
        h.posicionFinalY,
        suave
      );
  }


  if (
    progreso >= 1
  ) {

    herenciaEstado =
      "jugando";
  }
}


// =====================================================
// DIBUJAR PADRE
// =====================================================

function dibujarPadreHerencia() {

  if (
    herenciaPadre === null ||
    herenciaPadre.tamano <= 0
  ) {

    return;
  }


  sk.noStroke();


  sk.fill(
    150,
    50,
    220,
    18
  );


  sk.ellipse(
    herenciaPadre.x,
    herenciaPadre.y,
    herenciaPadre.tamano + 65,
    herenciaPadre.tamano + 65
  );


  sk.fill(
    150,
    50,
    220,
    40
  );


  sk.ellipse(
    herenciaPadre.x,
    herenciaPadre.y,
    herenciaPadre.tamano + 32,
    herenciaPadre.tamano + 32
  );


  sk.fill(
    150,
    50,
    220
  );


  sk.ellipse(
    herenciaPadre.x,
    herenciaPadre.y,
    herenciaPadre.tamano,
    herenciaPadre.tamano
  );
}


// =====================================================
// PARTICULAS VIOLETAS
// =====================================================

function dibujarParticulasHerencia() {

  sk.noStroke();


  for (
    var i = 0;
    i < herenciaParticulas.length;
    i++
  ) {

    var p =
      herenciaParticulas[i];


    sk.fill(
      150,
      50,
      220
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// =====================================================
// HEREDEROS
// =====================================================

function dibujarHerederosHerencia() {

  for (
    var i = 0;
    i < herenciaHerederos.length;
    i++
  ) {

    var h =
      herenciaHerederos[i];


    if (
      h.opacidad <= 0
    ) {

      continue;
    }


    var tamano =
      h.tamano *
      h.escala;


    sk.noStroke();


    // AURA

    sk.fill(
      h.rojo,
      h.verde,
      h.azul,
      18 *
      (
        h.opacidad / 255
      )
    );


    sk.ellipse(
      h.x,
      h.y,
      tamano + 30,
      tamano + 30
    );


    // CUERPO

    sk.fill(
      h.rojo,
      h.verde,
      h.azul,
      h.opacidad
    );


    sk.ellipse(
      h.x,
      h.y,
      tamano,
      tamano
    );
  }
}


// =====================================================
// FONDO
// =====================================================

function crearParticulasFondoHerencia() {

  herenciaParticulasFondo = [];


  for (
    var i = 0;
    i < herenciaCantidadParticulasFondo;
    i++
  ) {

    herenciaParticulasFondo.push({

      x: sk.random(sk.width),

      y: sk.random(sk.height),

      vx: sk.random(
        -0.1,
        0.1
      ),

      vy: sk.random(
        -0.1,
        0.1
      ),

      tamano: sk.random(
        1,
        3
      ),

      opacidad: sk.random(
        15,
        50
      )
    });
  }
}


function dibujarFondoHerencia() {

  sk.noStroke();


  for (
    var i = 0;
    i < herenciaParticulasFondo.length;
    i++
  ) {

    var p =
      herenciaParticulasFondo[i];


    p.x += p.vx;

    p.y += p.vy;


    if (
      p.x < 0
    ) {

      p.x = sk.width;
    }


    if (
      p.x > sk.width
    ) {

      p.x = 0;
    }


    if (
      p.y < 0
    ) {

      p.y = sk.height;
    }


    if (
      p.y > sk.height
    ) {

      p.y = 0;
    }


    sk.fill(
      150,
      150,
      160,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// =====================================================
// INTERACCION TOUCH
// =====================================================

function actualizarTouchHerencia() {

  if (
    sk.touches.length === 0
  ) {

    herenciaArrastrando = false;

    herenciaTouchID = -1;

    return;
  }


  // ---------------------------------------------------
  // SEGUIR ARRASTRANDO
  // ---------------------------------------------------

  if (
    herenciaArrastrando &&
    herenciaSeleccionado !== null &&
    herenciaTouchID !== -1
  ) {

    for (
      var i = 0;
      i < sk.touches.length;
      i++
    ) {

      if (
        sk.touches[i].id ===
        herenciaTouchID
      ) {

        herenciaSeleccionado.x =
          sk.touches[i].x;

        herenciaSeleccionado.y =
          sk.touches[i].y;

        return;
      }
    }


    herenciaArrastrando = false;

    herenciaTouchID = -1;

    return;
  }


  // ---------------------------------------------------
  // BUSCAR UN HEREDERO
  // ---------------------------------------------------

  if (
    herenciaEstado !== "jugando"
  ) {

    return;
  }


  for (
    var i =
      herenciaHerederos.length - 1;

    i >= 0;

    i--
  ) {

    var h =
      herenciaHerederos[i];


    for (
      var j = 0;
      j < sk.touches.length;
      j++
    ) {

      var distancia =
        sk.dist(
          sk.touches[j].x,
          sk.touches[j].y,
          h.x,
          h.y
        );


      if (
        distancia <
        h.tamano *
        h.escala /
        2
      ) {

        herenciaSeleccionado =
          h;

        herenciaArrastrando =
          true;

        herenciaTouchID =
          sk.touches[j].id;

        return;
      }
    }
  }
}


// =====================================================
// TOUCH STARTED
// =====================================================

sk.touchStarted = function() {

  activarFullscreenHerencia();

  return false;
}


// =====================================================
// TOUCH MOVED
// =====================================================

sk.touchMoved = function() {

  return false;
}


// =====================================================
// TOUCH ENDED
// =====================================================

sk.touchEnded = function() {

  if (
    sk.touches.length === 0
  ) {

    herenciaArrastrando = false;

    herenciaTouchID = -1;

    if (
      herenciaEstado === "jugando"
    ) {

      herenciaSeleccionado = null;
    }

  }

  return false;
}


// =====================================================
// FULLSCREEN
// =====================================================

function activarFullscreenHerencia() {

  if (
    !herenciaFullscreen
  ) {

    void 0;

    herenciaFullscreen = true;

  }
}


// =====================================================
// REDIMENSIONAR
// =====================================================

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );


  crearParticulasFondoHerencia();


  if (
    herenciaPadre
  ) {

    herenciaPadre.x =
      sk.width / 2;

    herenciaPadre.y =
      calcularYPadreHerencia();

    crearParticulasDelPadre();
  }


  if (
    herenciaEstado === "jugando"
  ) {

    var posiciones = [

      {
        x: sk.width * 0.18,
        y: sk.height * 0.85
      },

      {
        x: sk.width * 0.40,
        y: sk.height * 0.90
      },

      {
        x: sk.width * 0.60,
        y: sk.height * 0.90
      },

      {
        x: sk.width * 0.82,
        y: sk.height * 0.85
      }

    ];


    for (
      var i = 0;
      i < herenciaHerederos.length;
      i++
    ) {

      herenciaHerederos[i].x =
        posiciones[i].x;

      herenciaHerederos[i].y =
        posiciones[i].y;

      herenciaHerederos[i].posicionFinalX =
        posiciones[i].x;

      herenciaHerederos[i].posicionFinalY =
        posiciones[i].y;
    }
  }
}
}
function sketch_caducidad(sk) {
var canvasCaducidad;

var caducidadColorVioleta = [150, 50, 220];

var caducidadOpacidad = 255;

var caducidadVelocidadDesgaste = 1.00;
var caducidadVelocidadRecuperacion = 0.50;

var caducidadAumentoDesgaste = 0.05;
var caducidadReduccionRecuperacion = 0.005;

var caducidadClickAnterior = false;

var caducidadEstado = 0;

var caducidadTiempoGris = 2500;
var caducidadTiempoInicioGris = 0;

var caducidadOpacidadVioletaNuevo = 0;

var caducidadTiempoRadar = 0;
var caducidadIntervaloRadar = 1000;
var caducidadRadioRadar = 220;

var caducidadDuracionLatidoRojo = 4000;

var caducidadOpacidadGris = 255;

var caducidadParticulas = [];
var caducidadCantidadParticulas = 90;

var caducidadTocando = false;

var caducidadFullscreen = false;


// ---------------------------------------------------------
// SETUP
// ---------------------------------------------------------

sk.setup = function() {

  canvasCaducidad = sk.createCanvas(_anchoVentana(sk), _altoVentana(sk));

  canvasCaducidad.elt.style.touchAction = "none";

  crearParticulasCaducidad();

  iniciarCaducidad();
}


// ---------------------------------------------------------
// INICIAR / REINICIAR
// ---------------------------------------------------------

function iniciarCaducidad() {

  caducidadOpacidad = 255;

  caducidadVelocidadDesgaste = 1.00;

  caducidadVelocidadRecuperacion = 0.50;

  caducidadClickAnterior = false;

  caducidadEstado = 0;

  caducidadOpacidadVioletaNuevo = 255;

  caducidadOpacidadGris = 255;

  caducidadTiempoRadar = sk.millis();

  caducidadIntervaloRadar = 1000;

  caducidadRadioRadar = 220;

  caducidadTocando = false;
}


// ---------------------------------------------------------
// DRAW
// ---------------------------------------------------------

sk.draw = function() {

  sk.background(0);

  dibujarParticulasCaducidad();


  // -------------------------------------------------------
  // ACTUALIZAR TOUCH
  // -------------------------------------------------------

  actualizarTouchCaducidad();


  // -------------------------------------------------------
  // ESTADO 0
  // CÍRCULO VIOLETA DESGASTÁNDOSE
  // -------------------------------------------------------

  if (caducidadEstado === 0) {

    dibujarCirculoGrisCaducidad();

    actualizarCirculoCaducidad();

    actualizarRadarVioletaCaducidad();

    dibujarRadarVioletaCaducidad();

    dibujarCirculoVioletaCaducidad();
  }


  // -------------------------------------------------------
  // ESTADO 1
  // LATIDO / RADAR ROJO
  // -------------------------------------------------------

  else if (caducidadEstado === 1) {

    dibujarCirculoGrisCaducidad();

    dibujarRadarRojoCaducidad();


    if (
      sk.millis() - caducidadTiempoRadar >=
      caducidadDuracionLatidoRojo
    ) {

      caducidadEstado = 2;

      caducidadTiempoInicioGris = sk.millis();

      caducidadOpacidadGris = 255;
    }
  }


  // -------------------------------------------------------
  // ESTADO 2
  // CÍRCULO GRIS DESAPARECE
  // -------------------------------------------------------

  else if (caducidadEstado === 2) {

    dibujarCirculoGrisDesvaneciendose();

    caducidadOpacidadGris -= 4;


    if (caducidadOpacidadGris <= 0) {

      caducidadOpacidadGris = 0;

      caducidadEstado = 3;

      caducidadOpacidadVioletaNuevo = 0;
    }
  }


  // -------------------------------------------------------
  // ESTADO 3
  // NUEVO CÍRCULO VIOLETA APARECE
  // -------------------------------------------------------

  else if (caducidadEstado === 3) {

    dibujarCirculoVioletaNuevoCaducidad();

    caducidadOpacidadVioletaNuevo += 7;


    if (caducidadOpacidadVioletaNuevo >= 255) {

      caducidadOpacidadVioletaNuevo = 255;

      caducidadOpacidad = 255;

      caducidadVelocidadDesgaste = 1.00;

      caducidadVelocidadRecuperacion = 0.50;

      caducidadClickAnterior = false;

      caducidadEstado = 4;

      caducidadOpacidadGris = 0;
    }
  }


  // -------------------------------------------------------
  // ESTADO 4
  // CÍRCULO GRIS REAPARECE
  // -------------------------------------------------------

  else if (caducidadEstado === 4) {

    dibujarCirculoVioletaNuevoCaducidad();

    dibujarCirculoGrisReapareciendo();

    caducidadOpacidadGris += 7;


    if (caducidadOpacidadGris >= 255) {

      caducidadOpacidadGris = 255;

      caducidadEstado = 0;

      caducidadTiempoRadar = sk.millis();

      caducidadIntervaloRadar = 1000;

      caducidadRadioRadar = 220;
    }
  }
}


// ---------------------------------------------------------
// DETECTAR DEDO
// ---------------------------------------------------------

function actualizarTouchCaducidad() {

  if (caducidadEstado !== 0) {

    caducidadTocando = false;

    return;
  }


  var encontrado = false;

  var radioTouch =
    sk.min(sk.width, sk.height) * 0.18;


  // -------------------------------------------------------
  // REVISAMOS TODOS LOS DEDOS QUE ESTÉN EN PANTALLA
  // -------------------------------------------------------

  for (var i = 0; i < sk.touches.length; i++) {

    var distancia = sk.dist(
      sk.touches[i].x,
      sk.touches[i].y,
      sk.width / 2,
      sk.height / 2
    );


    if (distancia <= radioTouch) {

      encontrado = true;

      break;
    }
  }


  // -------------------------------------------------------
  // SI HAY UN DEDO SOBRE EL CÍRCULO
  // -------------------------------------------------------

  if (encontrado) {

    caducidadTocando = true;
  }

  else {

    caducidadTocando = false;
  }
}


// ---------------------------------------------------------
// ACTUALIZAR CÍRCULO
// ---------------------------------------------------------

function actualizarCirculoCaducidad() {

  var tocandoAhora =
    caducidadTocando;


  // -------------------------------------------------------
  // NUEVA INTERACCIÓN
  // -------------------------------------------------------

  if (
    tocandoAhora &&
    !caducidadClickAnterior
  ) {

    caducidadVelocidadDesgaste +=
      caducidadAumentoDesgaste;


    caducidadVelocidadRecuperacion =
      sk.max(
        caducidadVelocidadRecuperacion -
        caducidadReduccionRecuperacion,
        0.005
      );
  }


  caducidadClickAnterior =
    tocandoAhora;


  // -------------------------------------------------------
  // RECUPERACIÓN
  // -------------------------------------------------------

  if (tocandoAhora) {

    caducidadOpacidad +=
      caducidadVelocidadRecuperacion;
  }


  // -------------------------------------------------------
  // DESGASTE
  // -------------------------------------------------------

  else {

    caducidadOpacidad -=
      caducidadVelocidadDesgaste;
  }


  caducidadOpacidad =
    sk.constrain(
      caducidadOpacidad,
      0,
      255
    );


  // -------------------------------------------------------
  // CÍRCULO COMPLETAMENTE DESGASTADO
  // -------------------------------------------------------

  if (caducidadOpacidad <= 0) {

    caducidadOpacidad = 0;

    caducidadEstado = 1;

    caducidadTiempoRadar = sk.millis();

    caducidadRadioRadar = 220;

    caducidadClickAnterior = false;

    caducidadTocando = false;
  }
}


// ---------------------------------------------------------
// RADAR VIOLETA
// ---------------------------------------------------------

function actualizarRadarVioletaCaducidad() {

  var desgaste =
    1 - caducidadOpacidad / 255;


  caducidadIntervaloRadar =
    sk.lerp(
      1000,
      180,
      desgaste
    );


  if (
    sk.millis() - caducidadTiempoRadar >=
    caducidadIntervaloRadar
  ) {

    caducidadTiempoRadar = sk.millis();

    caducidadRadioRadar = 220;
  }


  caducidadRadioRadar += 5;
}


// ---------------------------------------------------------
// DIBUJAR RADAR VIOLETA
// ---------------------------------------------------------

function dibujarRadarVioletaCaducidad() {

  var progreso =
    sk.constrain(
      sk.map(
        caducidadRadioRadar,
        220,
        420,
        0,
        1
      ),
      0,
      1
    );


  var opacidad =
    caducidadOpacidad *
    (1 - progreso);


  sk.noFill();

  sk.stroke(
    caducidadColorVioleta[0],
    caducidadColorVioleta[1],
    caducidadColorVioleta[2],
    opacidad
  );

  sk.strokeWeight(5);


  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    caducidadRadioRadar,
    caducidadRadioRadar
  );


  sk.noStroke();
}


// ---------------------------------------------------------
// CÍRCULO GRIS
// ---------------------------------------------------------

function dibujarCirculoGrisCaducidad() {

  sk.noStroke();

  sk.fill(
    150,
    150,
    155,
    caducidadOpacidadGris
  );


  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    220,
    220
  );
}


function dibujarCirculoGrisDesvaneciendose() {

  sk.noStroke();

  sk.fill(
    150,
    150,
    155,
    caducidadOpacidadGris
  );


  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    220,
    220
  );
}


function dibujarCirculoGrisReapareciendo() {

  sk.noStroke();

  sk.fill(
    150,
    150,
    155,
    caducidadOpacidadGris
  );


  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    220,
    220
  );
}


// ---------------------------------------------------------
// CÍRCULO VIOLETA
// ---------------------------------------------------------

function dibujarCirculoVioletaCaducidad() {

  var opacidad =
    caducidadOpacidad;


  sk.noStroke();


  // Aura exterior

  sk.fill(
    150,
    50,
    220,
    opacidad * 0.06
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    290,
    290
  );


  // Aura intermedia

  sk.fill(
    150,
    50,
    220,
    opacidad * 0.14
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    255,
    255
  );


  // Aura cercana

  sk.fill(
    150,
    50,
    220,
    opacidad * 0.25
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    235,
    235
  );


  // Círculo principal

  sk.fill(
    150,
    50,
    220,
    opacidad
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    220,
    220
  );
}


// ---------------------------------------------------------
// NUEVO CÍRCULO VIOLETA
// ---------------------------------------------------------

function dibujarCirculoVioletaNuevoCaducidad() {

  var opacidad =
    caducidadOpacidadVioletaNuevo;


  sk.noStroke();


  sk.fill(
    150,
    50,
    220,
    opacidad * 0.06
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    290,
    290
  );


  sk.fill(
    150,
    50,
    220,
    opacidad * 0.14
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    255,
    255
  );


  sk.fill(
    150,
    50,
    220,
    opacidad * 0.25
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    235,
    235
  );


  sk.fill(
    150,
    50,
    220,
    opacidad
  );

  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    220,
    220
  );
}


// ---------------------------------------------------------
// RADAR ROJO FINAL
// ---------------------------------------------------------

function dibujarRadarRojoCaducidad() {

  var progreso =
    sk.constrain(
      (
        sk.millis() -
        caducidadTiempoRadar
      ) /
      caducidadDuracionLatidoRojo,
      0,
      1
    );


  var onda =
    progreso *
    progreso *
    (3 - 2 * progreso);


  var radio =
    sk.lerp(
      220,
      sk.max(sk.width, sk.height) * 1.15,
      onda
    );


  var opacidad;


  if (progreso < 0.15) {

    opacidad =
      sk.map(
        progreso,
        0,
        0.15,
        0,
        255
      );
  }

  else {

    opacidad =
      sk.map(
        progreso,
        0.15,
        1,
        255,
        0
      );
  }


  sk.noFill();

  sk.stroke(
    255,
    0,
    0,
    opacidad
  );

  sk.strokeWeight(6);


  sk.ellipse(
    sk.width / 2,
    sk.height / 2,
    radio,
    radio
  );


  sk.noStroke();
}


// ---------------------------------------------------------
// CREAR PARTÍCULAS
// ---------------------------------------------------------

function crearParticulasCaducidad() {

  caducidadParticulas = [];


  for (
    var i = 0;
    i < caducidadCantidadParticulas;
    i++
  ) {

    caducidadParticulas.push({

      x: sk.random(sk.width),

      y: sk.random(sk.height),

      vx: sk.random(-0.15, 0.15),

      vy: sk.random(-0.15, 0.15),

      tamano: sk.random(1, 3),

      opacidad: sk.random(15, 50)
    });
  }
}


// ---------------------------------------------------------
// DIBUJAR PARTÍCULAS
// ---------------------------------------------------------

function dibujarParticulasCaducidad() {

  sk.noStroke();


  for (
    var i = 0;
    i < caducidadParticulas.length;
    i++
  ) {

    var p =
      caducidadParticulas[i];


    p.x += p.vx;

    p.y += p.vy;


    if (p.x < 0) {

      p.x = sk.width;
    }


    if (p.x > sk.width) {

      p.x = 0;
    }


    if (p.y < 0) {

      p.y = sk.height;
    }


    if (p.y > sk.height) {

      p.y = 0;
    }


    sk.fill(
      150,
      150,
      160,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// ---------------------------------------------------------
// TOUCH STARTED
// ---------------------------------------------------------

sk.touchStarted = function() {

  activarFullscreenCaducidad();

  return false;
}


// ---------------------------------------------------------
// TOUCH MOVED
// ---------------------------------------------------------

sk.touchMoved = function() {

  return false;
}


// ---------------------------------------------------------
// TOUCH ENDED
// ---------------------------------------------------------

sk.touchEnded = function() {

  return false;
}


// ---------------------------------------------------------
// FULLSCREEN
// ---------------------------------------------------------

function activarFullscreenCaducidad() {

  if (!caducidadFullscreen) {

    void 0;

    caducidadFullscreen = true;
  }
}


// ---------------------------------------------------------
// CAMBIO DE TAMAÑO
// ---------------------------------------------------------

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );

  crearParticulasCaducidad();
}
}
function sketch_identidad(sk) {
var identidadJugadorX = 0;
var identidadJugadorY = 0;
var identidadJugadorTamano = 60;

var identidadCantidadHuecos = 30;

var identidadHuecosX = [];
var identidadHuecosY = [];
var identidadHuecosTamano = [];

var identidadHuecoCorrecto = 0;

var identidadArrastrando = false;
var identidadTiempoTitileo = 0;

var identidadCompletado = false;
var identidadVerdeFinal = 0;

var identidadParticulas = [];
var identidadCantidadParticulas = 110;

var identidadFullscreen = false;


// =====================================================
// SETUP
// =====================================================

sk.setup = function() {

  sk.createCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );

  crearParticulasIdentidad();

  iniciarIdentidad();
}


// =====================================================
// DRAW
// =====================================================

sk.draw = function() {

  sk.background(0);

  actualizarParticulasIdentidad();

  dibujarParticulasIdentidad();


  // ===================================================
  // JUEGO
  // ===================================================

  if (!identidadCompletado) {

    dibujarEscenarioIdentidad();


    // -----------------------------------------------
    // CALCULAR DISTANCIA AL HUECO CORRECTO
    // -----------------------------------------------

    var distancia = sk.dist(
      identidadJugadorX,
      identidadJugadorY,
      identidadHuecosX[
        identidadHuecoCorrecto
      ],
      identidadHuecosY[
        identidadHuecoCorrecto
      ]
    );


    // -----------------------------------------------
    // VELOCIDAD DEL TITILEO
    // -----------------------------------------------

    var distanciaMaxima =
      sk.max(
        sk.width,
        sk.height
      );


    var velocidadTitileo = sk.map(
      distancia,
      distanciaMaxima,
      0,
      0.03,
      0.45
    );


    velocidadTitileo = sk.constrain(
      velocidadTitileo,
      0.03,
      0.45
    );


    identidadTiempoTitileo +=
      velocidadTitileo;


    var opacidad = sk.map(
      sk.sin(
        identidadTiempoTitileo
      ),
      -1,
      1,
      80,
      255
    );


    // -----------------------------------------------
    // JUGADOR
    // -----------------------------------------------

    dibujarJugadorIdentidad(
      identidadJugadorX,
      identidadJugadorY,
      identidadJugadorTamano,
      opacidad
    );


    // -----------------------------------------------
    // COMPROBAR POSICION
    // -----------------------------------------------

    var posicionCorrecta =
      distancia < 5;


    // -----------------------------------------------
    // COMPROBAR TAMAÑO
    // -----------------------------------------------

    var tamanioCorrecto =
      sk.abs(
        identidadJugadorTamano -
        identidadHuecosTamano[
          identidadHuecoCorrecto
        ]
      ) < 0.01;


    // -----------------------------------------------
    // VICTORIA
    // -----------------------------------------------

    if (
      posicionCorrecta &&
      tamanioCorrecto
    ) {

      identidadCompletado =
        true;

      identidadVerdeFinal =
        0;
    }


  } else {

    dibujarPantallaVictoriaIdentidad();
  }
}


// =====================================================
// INICIAR IDENTIDAD
// =====================================================

function iniciarIdentidad() {

  identidadHuecosX =
    new Array(
      identidadCantidadHuecos
    );

  identidadHuecosY =
    new Array(
      identidadCantidadHuecos
    );

  identidadHuecosTamano =
    new Array(
      identidadCantidadHuecos
    );


  identidadCompletado =
    false;

  identidadVerdeFinal =
    0;


  crearEscenarioIdentidad();
}


// =====================================================
// CREAR ESCENARIO
// =====================================================

function crearEscenarioIdentidad() {

  // Usamos el tamaño de la pantalla para determinar
  // los tamaños de los elementos.

  var ladoReferencia =
    sk.min(
      sk.width,
      sk.height
    );


  // ===================================================
  // JUGADOR
  // ===================================================

  identidadJugadorTamano =
    sk.random(
      ladoReferencia * 0.075,
      ladoReferencia * 0.105
    );


  identidadJugadorX =
    sk.random(
      identidadJugadorTamano / 2 + 30,
      sk.width -
      identidadJugadorTamano / 2 -
      30
    );


  identidadJugadorY =
    sk.random(
      identidadJugadorTamano / 2 + 30,
      sk.height -
      identidadJugadorTamano / 2 -
      30
    );


  // ===================================================
  // ELEGIR HUECO CORRECTO
  // ===================================================

  identidadHuecoCorrecto =
    sk.floor(
      sk.random(
        identidadCantidadHuecos
      )
    );


  // ===================================================
  // TAMAÑOS DE LOS HUECOS
  // ===================================================

  for (
    var i = 0;
    i < identidadCantidadHuecos;
    i++
  ) {

    if (
      i === identidadHuecoCorrecto
    ) {

      // El correcto tiene exactamente
      // el mismo tamaño que el jugador.

      identidadHuecosTamano[i] =
        identidadJugadorTamano;

    } else {

      var posibilidad =
        sk.random(1);


      // Algunos son parecidos,
      // pero ligeramente diferentes.

      if (
        posibilidad < 0.45
      ) {

        var diferencia =
          sk.random(
            3,
            9
          );


        if (
          sk.random(1) < 0.5
        ) {

          identidadHuecosTamano[i] =
            sk.max(
              ladoReferencia * 0.025,
              identidadJugadorTamano -
              diferencia
            );

        } else {

          identidadHuecosTamano[i] =
            identidadJugadorTamano +
            diferencia;
        }


      } else {

        // Otros son claramente diferentes.

        if (
          sk.random(1) < 0.5
        ) {

          identidadHuecosTamano[i] =
            sk.random(
              ladoReferencia * 0.025,
              ladoReferencia * 0.07
            );

        } else {

          identidadHuecosTamano[i] =
            sk.random(
              ladoReferencia * 0.12,
              ladoReferencia * 0.20
            );
        }
      }
    }
  }


  // ===================================================
  // UBICAR HUECOS
  // ===================================================

  for (
    var i = 0;
    i < identidadCantidadHuecos;
    i++
  ) {

    var colocado =
      false;


    var mejorX =
      sk.width / 2;


    var mejorY =
      sk.height / 2;


    var mejorEspacio =
      -Infinity;


    // -------------------------------------------------
    // MUCHOS INTENTOS PARA ENCONTRAR UN LUGAR
    // -------------------------------------------------

    for (
      var intento = 0;
      intento < 1500;
      intento++
    ) {

      var tamano =
        identidadHuecosTamano[i];


      var margen =
        tamano / 2 +
        20;


      var candidatoX =
        sk.random(
          margen,
          sk.width -
          margen
        );


      var candidatoY =
        sk.random(
          margen,
          sk.height -
          margen
        );


      var espacioMinimo =
        Infinity;


      // ------------------------------------------------
      // COMPARAR CON LOS HUECOS ANTERIORES
      // ------------------------------------------------

      for (
        var j = 0;
        j < i;
        j++
      ) {

        var distancia =
          sk.dist(
            candidatoX,
            candidatoY,
            identidadHuecosX[j],
            identidadHuecosY[j]
          );


        var distanciaNecesaria =
          tamano / 2 +
          identidadHuecosTamano[j] / 2 +
          18;


        var espacio =
          distancia -
          distanciaNecesaria;


        if (
          espacio <
          espacioMinimo
        ) {

          espacioMinimo =
            espacio;
        }
      }


      // ------------------------------------------------
      // COMPARAR CON EL JUGADOR
      // ------------------------------------------------

      var distanciaJugador =
        sk.dist(
          candidatoX,
          candidatoY,
          identidadJugadorX,
          identidadJugadorY
        );


      var distanciaNecesariaJugador =
        tamano / 2 +
        identidadJugadorTamano / 2 +
        30;


      var espacioJugador =
        distanciaJugador -
        distanciaNecesariaJugador;


      if (
        espacioJugador <
        espacioMinimo
      ) {

        espacioMinimo =
          espacioJugador;
      }


      // ------------------------------------------------
      // GUARDAR LA MEJOR POSICION
      // ------------------------------------------------

      if (
        espacioMinimo >
        mejorEspacio
      ) {

        mejorEspacio =
          espacioMinimo;

        mejorX =
          candidatoX;

        mejorY =
          candidatoY;
      }


      // ------------------------------------------------
      // SI ES SUFICIENTEMENTE BUENA, USARLA
      // ------------------------------------------------

      if (
        espacioMinimo >= 12
      ) {

        identidadHuecosX[i] =
          candidatoX;

        identidadHuecosY[i] =
          candidatoY;

        colocado =
          true;

        break;
      }
    }


    // -------------------------------------------------
    // SI NO ENCONTRO UNA POSICION PERFECTA
    // USA LA MEJOR QUE ENCONTRO
    // -------------------------------------------------

    if (
      !colocado
    ) {

      identidadHuecosX[i] =
        mejorX;

      identidadHuecosY[i] =
        mejorY;
    }
  }


  identidadTiempoTitileo =
    0;

  identidadArrastrando =
    false;
}


// =====================================================
// DIBUJAR ESCENARIO
// =====================================================

function dibujarEscenarioIdentidad() {

  sk.rectMode(sk.CENTER);

  sk.noStroke();


  for (
    var i = 0;
    i < identidadCantidadHuecos;
    i++
  ) {

    if (
      !Number.isFinite(
        identidadHuecosX[i]
      ) ||

      !Number.isFinite(
        identidadHuecosY[i]
      ) ||

      !Number.isFinite(
        identidadHuecosTamano[i]
      )
    ) {

      continue;
    }


    sk.fill(
      70,
      70,
      80
    );


    sk.rect(
      identidadHuecosX[i],
      identidadHuecosY[i],
      identidadHuecosTamano[i],
      identidadHuecosTamano[i]
    );
  }


  sk.rectMode(sk.CORNER);
}


// =====================================================
// DIBUJAR JUGADOR
// =====================================================

function dibujarJugadorIdentidad(
  x,
  y,
  tamano,
  opacidad
) {

  sk.rectMode(sk.CENTER);

  sk.noStroke();


  // Aura exterior

  sk.fill(
    150,
    50,
    220,
    opacidad * 0.08
  );


  sk.rect(
    x,
    y,
    tamano + 60,
    tamano + 60
  );


  // Aura media

  sk.fill(
    150,
    50,
    220,
    opacidad * 0.15
  );


  sk.rect(
    x,
    y,
    tamano + 35,
    tamano + 35
  );


  // Aura cercana

  sk.fill(
    150,
    50,
    220,
    opacidad * 0.30
  );


  sk.rect(
    x,
    y,
    tamano + 15,
    tamano + 15
  );


  // Cuadrado principal

  sk.stroke(
    220,
    180,
    255,
    opacidad
  );


  sk.strokeWeight(2);


  sk.fill(
    150,
    50,
    220,
    opacidad
  );


  sk.rect(
    x,
    y,
    tamano,
    tamano
  );


  sk.rectMode(sk.CORNER);
}


// =====================================================
// PANTALLA DE VICTORIA
// =====================================================

function dibujarPantallaVictoriaIdentidad() {

  identidadVerdeFinal += 2;


  var opacidad =
    sk.min(
      identidadVerdeFinal,
      255
    );


  // ===================================================
  // AHORA CUBRE TODA LA PANTALLA
  // ===================================================

  sk.noStroke();


  sk.fill(
    150,
    50,
    220,
    opacidad
  );


  sk.rectMode(sk.CORNER);


  sk.rect(
    0,
    0,
    sk.width,
    sk.height
  );


  // ===================================================
  // REINICIAR
  // ===================================================

  if (
    identidadVerdeFinal >= 510
  ) {

    identidadCompletado =
      false;

    identidadVerdeFinal =
      0;

    crearEscenarioIdentidad();
  }
}


// =====================================================
// PARTICULAS
// =====================================================

function crearParticulasIdentidad() {

  identidadParticulas =
    [];


  for (
    var i = 0;
    i < identidadCantidadParticulas;
    i++
  ) {

    identidadParticulas.push({

      x:
        sk.random(sk.width),

      y:
        sk.random(sk.height),

      vx:
        sk.random(
          -0.15,
          0.15
        ),

      vy:
        sk.random(
          -0.15,
          0.15
        ),

      tamano:
        sk.random(
          1,
          3
        ),

      opacidad:
        sk.random(
          15,
          55
        )
    });
  }
}


function actualizarParticulasIdentidad() {

  for (
    var i = 0;
    i < identidadParticulas.length;
    i++
  ) {

    var p =
      identidadParticulas[i];


    p.x += p.vx;

    p.y += p.vy;


    if (
      p.x < 0
    ) {

      p.x =
        sk.width;
    }


    if (
      p.x > sk.width
    ) {

      p.x =
        0;
    }


    if (
      p.y < 0
    ) {

      p.y =
        sk.height;
    }


    if (
      p.y > sk.height
    ) {

      p.y =
        0;
    }
  }
}


function dibujarParticulasIdentidad() {

  sk.noStroke();


  for (
    var i = 0;
    i < identidadParticulas.length;
    i++
  ) {

    var p =
      identidadParticulas[i];


    sk.fill(
      150,
      150,
      160,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// =====================================================
// TOUCH
// =====================================================

sk.touchStarted = function() {

  activarFullscreenIdentidad();


  if (
    identidadCompletado
  ) {

    return false;
  }


  if (
    sk.touches.length === 0
  ) {

    return false;
  }


  var toqueX =
    sk.touches[0].x;


  var toqueY =
    sk.touches[0].y;


  var distancia =
    sk.dist(
      toqueX,
      toqueY,
      identidadJugadorX,
      identidadJugadorY
    );


  if (
    distancia <
    identidadJugadorTamano / 2
  ) {

    identidadArrastrando =
      true;
  }


  return false;
}


// =====================================================
// ARRASTRE
// =====================================================

sk.touchMoved = function() {

  if (
    identidadCompletado
  ) {

    return false;
  }


  if (
    !identidadArrastrando
  ) {

    return false;
  }


  if (
    sk.touches.length > 0
  ) {

    identidadJugadorX =
      sk.touches[0].x;


    identidadJugadorY =
      sk.touches[0].y;
  }


  // El jugador puede recorrer toda la pantalla.

  identidadJugadorX =
    sk.constrain(
      identidadJugadorX,
      identidadJugadorTamano / 2,
      sk.width -
      identidadJugadorTamano / 2
    );


  identidadJugadorY =
    sk.constrain(
      identidadJugadorY,
      identidadJugadorTamano / 2,
      sk.height -
      identidadJugadorTamano / 2
    );


  return false;
}


// =====================================================
// SOLTAR
// =====================================================

sk.touchEnded = function() {

  identidadArrastrando =
    false;

  return false;
}


// =====================================================
// FULLSCREEN
// =====================================================

function activarFullscreenIdentidad() {

  if (
    !identidadFullscreen
  ) {

    void 0;

    identidadFullscreen =
      true;
  }
}


// =====================================================
// CAMBIO DE TAMAÑO
// =====================================================

sk.windowResized = function() {

  sk.resizeCanvas(
    _anchoVentana(sk),
    _altoVentana(sk)
  );


  crearParticulasIdentidad();

  crearEscenarioIdentidad();
}


// =====================================================
// ESC
// =====================================================

sk.keyPressed = function() {

  if (
    sk.keyCode === sk.ESCAPE
  ) {

    void 0;

    identidadFullscreen =
      false;
  }
}
}
function sketch_empatia(sk) {
var empatiaCantidadCuadrados = 4;

var empatiaCuadrados = [];

var empatiaCantidadMoleculas = 140;

var empatiaMoleculaX = [];
var empatiaMoleculaY = [];

var empatiaMoleculaDestinoX = [];
var empatiaMoleculaDestinoY = [];

var empatiaMoleculaOrigen = [];
var empatiaMoleculaDestino = [];

var empatiaMoleculaActiva = [];
var empatiaMoleculaVelocidad = [];

var empatiaTransfiriendo = false;
var empatiaOrigen = -1;

var empatiaEquilibrio = false;

var empatiaTiempoEquilibrio = 0;
var empatiaDuracionEquilibrio = 120;

var empatiaPulso = 0;

var empatiaParticulas = [];
var empatiaCantidadParticulas = 90;

var empatiaTouchActivo = false;
var empatiaTouchID = -1;

var empatiaFullscreen = false;


// ========================================
// SETUP
// ========================================

sk.setup = function() {

  sk.createCanvas(_anchoVentana(sk), _altoVentana(sk));

  crearParticulasEmpatia();

  iniciarEmpatia();
}


// ========================================
// DRAW
// ========================================

sk.draw = function() {

  sk.background(0);

  actualizarEstadoTouchEmpatia();

  dibujarParticulasEmpatia();


  if (empatiaEquilibrio) {

    ejecutarPulsoEmpatia();

    return;
  }


  if (empatiaTransfiriendo) {

    generarMoleculasEmpatia();
  }


  actualizarMoleculasEmpatia();

  comprobarEquilibrioEmpatia();

  dibujarMoleculasEmpatia();

  dibujarCuadradosEmpatia();
}


// ========================================
// INICIAR EMPATÍA
// ========================================

function iniciarEmpatia() {

  empatiaMoleculaX =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaY =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaDestinoX =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaDestinoY =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaOrigen =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaDestino =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaActiva =
    new Array(empatiaCantidadMoleculas);

  empatiaMoleculaVelocidad =
    new Array(empatiaCantidadMoleculas);


  for (
    var i = 0;
    i < empatiaCantidadMoleculas;
    i++
  ) {

    empatiaMoleculaActiva[i] = false;
  }


  crearEscenarioEmpatia();
}


// ========================================
// CREAR ESCENARIO
// ========================================

function crearEscenarioEmpatia() {

  empatiaCuadrados = [];

  empatiaTransfiriendo = false;

  empatiaOrigen = -1;

  empatiaEquilibrio = false;

  empatiaTiempoEquilibrio = 0;

  empatiaPulso = 0;

  empatiaTouchActivo = false;

  empatiaTouchID = -1;


  var ladoReferencia =
    sk.min(sk.width, sk.height);


  var margenX =
    sk.width * 0.22;

  var margenY =
    sk.height * 0.25;


  // CUADRADO 1

  empatiaCuadrados.push({

    x: margenX,

    y: margenY,

    tamano: sk.random(
      ladoReferencia * 0.15,
      ladoReferencia * 0.21
    )
  });


  // CUADRADO 2

  empatiaCuadrados.push({

    x: sk.width - margenX,

    y: margenY,

    tamano: sk.random(
      ladoReferencia * 0.08,
      ladoReferencia * 0.13
    )
  });


  // CUADRADO 3

  empatiaCuadrados.push({

    x: margenX,

    y: sk.height - margenY,

    tamano: sk.random(
      ladoReferencia * 0.17,
      ladoReferencia * 0.24
    )
  });


  // CUADRADO 4

  empatiaCuadrados.push({

    x: sk.width - margenX,

    y: sk.height - margenY,

    tamano: sk.random(
      ladoReferencia * 0.10,
      ladoReferencia * 0.16
    )
  });


  for (
    var i = 0;
    i < empatiaCantidadMoleculas;
    i++
  ) {

    empatiaMoleculaActiva[i] = false;
  }
}


// ========================================
// PARTÍCULAS DE FONDO
// ========================================

function crearParticulasEmpatia() {

  empatiaParticulas = [];


  for (
    var i = 0;
    i < empatiaCantidadParticulas;
    i++
  ) {

    empatiaParticulas.push({

      x: sk.random(sk.width),

      y: sk.random(sk.height),

      vx: sk.random(
        -0.15,
        0.15
      ),

      vy: sk.random(
        -0.15,
        0.15
      ),

      tamano: sk.random(
        1,
        3
      ),

      opacidad: sk.random(
        15,
        55
      )
    });
  }
}


function dibujarParticulasEmpatia() {

  sk.noStroke();


  for (
    var i = 0;
    i < empatiaParticulas.length;
    i++
  ) {

    var p =
      empatiaParticulas[i];


    p.x += p.vx;

    p.y += p.vy;


    if (p.x < 0) {

      p.x = sk.width;
    }


    if (p.x > sk.width) {

      p.x = 0;
    }


    if (p.y < 0) {

      p.y = sk.height;
    }


    if (p.y > sk.height) {

      p.y = 0;
    }


    sk.fill(
      150,
      150,
      160,
      p.opacidad
    );


    sk.ellipse(
      p.x,
      p.y,
      p.tamano,
      p.tamano
    );
  }
}


// ========================================
// PROGRESO
// ========================================

function obtenerProgresoEmpatia() {

  var mayor = -Infinity;

  var menor = Infinity;


  for (
    var i = 0;
    i < empatiaCuadrados.length;
    i++
  ) {

    mayor =
      sk.max(
        mayor,
        empatiaCuadrados[i].tamano
      );


    menor =
      sk.min(
        menor,
        empatiaCuadrados[i].tamano
      );
  }


  var diferencia =
    mayor - menor;


  return sk.constrain(

    sk.map(
      diferencia,
      80,
      0,
      0,
      1
    ),

    0,
    1
  );
}


// ========================================
// DIBUJAR CUADRADOS
// ========================================

function dibujarCuadradosEmpatia() {

  var progreso =
    obtenerProgresoEmpatia();


  for (
    var i = 0;
    i < empatiaCuadrados.length;
    i++
  ) {

    var cuadrado =
      empatiaCuadrados[i];


    var pulso = 1;


    if (
      i !== empatiaOrigen
    ) {

      pulso =
        1 +
        sk.sin(
          sk.millis() * 0.003
        ) *
        0.025;
    }


    var tamano =
      cuadrado.tamano *
      pulso;


    var rojo =
      sk.lerp(
        190,
        150,
        progreso
      );


    var verde =
      sk.lerp(
        190,
        50,
        progreso
      );


    var azul =
      sk.lerp(
        195,
        220,
        progreso
      );


    sk.noStroke();


    // AURA EXTERIOR

    sk.fill(
      rojo,
      verde,
      azul,
      14
    );


    sk.rectMode(sk.CENTER);

    sk.rect(
      cuadrado.x,
      cuadrado.y,
      tamano + 50,
      tamano + 50
    );


    // SEGUNDA AURA

    sk.fill(
      rojo,
      verde,
      azul,
      28
    );


    sk.rect(
      cuadrado.x,
      cuadrado.y,
      tamano + 28,
      tamano + 28
    );


    // BRILLO DEL SELECCIONADO

    if (
      i === empatiaOrigen
    ) {

      sk.fill(
        210,
        170,
        255,
        80
      );


      sk.rect(
        cuadrado.x,
        cuadrado.y,
        cuadrado.tamano + 15,
        cuadrado.tamano + 15
      );
    }


    // CUADRADO PRINCIPAL

    sk.fill(
      rojo,
      verde,
      azul
    );


    sk.rect(
      cuadrado.x,
      cuadrado.y,
      tamano,
      tamano
    );


    // NÚCLEO

    if (
      i === empatiaOrigen
    ) {

      sk.fill(
        230,
        180,
        255
      );


      sk.rect(
        cuadrado.x,
        cuadrado.y,
        cuadrado.tamano - 18,
        cuadrado.tamano - 18
      );
    }
  }


  sk.rectMode(sk.CORNER);
}


// ========================================
// GENERAR MOLÉCULAS
// ========================================

function generarMoleculasEmpatia() {

  if (
    empatiaOrigen < 0
  ) {

    return;
  }


  for (
    var i = 0;
    i < empatiaCantidadMoleculas;
    i++
  ) {

    if (
      !empatiaMoleculaActiva[i]
    ) {

      var destino =
        sk.floor(
          sk.random(3)
        );


      var contador = 0;


      for (
        var j = 0;
        j < empatiaCuadrados.length;
        j++
      ) {

        if (
          j !== empatiaOrigen
        ) {

          if (
            contador === destino
          ) {

            destino = j;

            break;
          }


          contador++;
        }
      }


      empatiaMoleculaActiva[i] =
        true;


      empatiaMoleculaOrigen[i] =
        empatiaOrigen;


      empatiaMoleculaDestino[i] =
        destino;


      empatiaMoleculaX[i] =
        empatiaCuadrados[
          empatiaOrigen
        ].x;


      empatiaMoleculaY[i] =
        empatiaCuadrados[
          empatiaOrigen
        ].y;


      empatiaMoleculaDestinoX[i] =
        empatiaCuadrados[
          destino
        ].x;


      empatiaMoleculaDestinoY[i] =
        empatiaCuadrados[
          destino
        ].y;


      empatiaMoleculaVelocidad[i] =
        sk.random(
          0.04,
          0.08
        );


      break;
    }
  }
}


// ========================================
// ACTUALIZAR MOLÉCULAS
// ========================================

function actualizarMoleculasEmpatia() {

  for (
    var i = 0;
    i < empatiaCantidadMoleculas;
    i++
  ) {

    if (
      !empatiaMoleculaActiva[i]
    ) {

      continue;
    }


    empatiaMoleculaX[i] =
      sk.lerp(
        empatiaMoleculaX[i],
        empatiaMoleculaDestinoX[i],
        empatiaMoleculaVelocidad[i]
      );


    empatiaMoleculaY[i] =
      sk.lerp(
        empatiaMoleculaY[i],
        empatiaMoleculaDestinoY[i],
        empatiaMoleculaVelocidad[i]
      );


    var distancia =
      sk.dist(
